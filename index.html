<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Match — find out where your Venus really stands</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg-deep:#080a1c;
  --bg-card:#141833;
  --bg-card-2:#1c2144;
  --text-main:#f0eef7;
  --text-dim:#a6a8c4;
  --gold:#e8b860;
  --rose:#d68fa3;
  --line:rgba(232,184,96,0.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg-deep);
  color:var(--text-main);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}

#milkyway{
  position:fixed;inset:-20%;z-index:0;pointer-events:none;overflow:hidden;
}
#milkyway::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:180vmax;height:38vmax;
  transform:translate(-50%,-50%) rotate(-22deg);
  background:linear-gradient(90deg,
    rgba(180,170,220,0) 0%,
    rgba(190,180,230,0.05) 12%,
    rgba(210,195,235,0.09) 30%,
    rgba(225,210,240,0.11) 50%,
    rgba(210,195,235,0.09) 70%,
    rgba(190,180,230,0.05) 88%,
    rgba(180,170,220,0) 100%
  );
  filter:blur(18px);
  opacity:0.5;
}
#milkyway::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:170vmax;height:16vmax;
  transform:translate(-50%,-50%) rotate(-22deg);
  background:linear-gradient(90deg,
    rgba(232,184,96,0) 0%,
    rgba(232,184,96,0.04) 20%,
    rgba(214,143,163,0.06) 50%,
    rgba(232,184,96,0.04) 80%,
    rgba(232,184,96,0) 100%
  );
  filter:blur(30px);
  opacity:0.6;
}
.star{
  position:absolute;background:#fff;border-radius:50%;
  animation:twinkle ease-in-out infinite;
  box-shadow:0 0 4px 1px rgba(255,255,255,0.6);
}
.star-close{
  box-shadow:0 0 10px 3px rgba(255,255,255,0.75), 0 0 18px 6px rgba(232,184,96,0.25);
}
@keyframes twinkle{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}

.comet{
  position:relative;
  width:4px;height:4px;
  background:#fff;
  image-rendering:pixelated;
  box-shadow:
    -4px 0 0 0 #fff,
    -8px 0 0 0 #e8e6f5,
    -12px 0 0 0 #c7c4dd,
    -16px 0 0 0 #9a97b8,
    -20px 0 0 0 #6d6a8f,
    0 0 8px 2px rgba(255,255,255,0.8);
  animation:comet-fly linear forwards;
}
@keyframes comet-fly{
  0%{transform:translateX(0);opacity:0;}
  8%{opacity:1;}
  85%{opacity:1;}
  100%{transform:translateX(var(--dist));opacity:0;}
}

@keyframes ufo-fly{
  0%{transform:translate(0,0);opacity:0;}
  6%{opacity:1;}
  25%{transform:translate(28vw,-2vh);}
  50%{transform:translate(56vw,2vh);}
  75%{transform:translate(84vw,-1.5vh);}
  94%{opacity:1;}
  100%{transform:translate(115vw,0);opacity:0;}
}

.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:40px 24px 60px;min-height:100vh;display:flex;flex-direction:column;}

h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  font-size:clamp(26px,3.4vw,38px);
  text-align:center;
  letter-spacing:0.01em;
  background:linear-gradient(180deg,#fff,var(--gold));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{
  text-align:center;
  color:var(--text-dim);
  font-size:13.5px;
  max-width:520px;
  margin:8px auto 0;
  line-height:1.5;
}
.privacy-note{
  text-align:center;
  color:var(--text-dim);
  font-size:11px;
  margin-top:6px;
  opacity:0.65;
}

.stage{
  position:relative;
  margin-top:auto;
  margin-bottom:auto;
  flex:1;
  display:flex;
  align-items:center;
}

.people{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:28px;
  align-items:center;
  width:100%;
}
@media(max-width:860px){
  .people{grid-template-columns:1fr;}
  .orbit-zone{order:3;padding:20px 0;}
}

.person-card{
  background:var(--bg-card);
  border:0.5px solid var(--line);
  border-radius:16px;
  padding:22px 22px;
}
.person-card h2{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-style:italic;
  font-size:20px;
  color:var(--rose);
  margin-bottom:16px;
}
.field{margin-bottom:12px;}
.field label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--text-dim);
  margin-bottom:5px;
}
.field input{
  width:100%;
  background:var(--bg-card-2);
  border:0.5px solid var(--line);
  border-radius:8px;
  padding:9px 12px;
  color:var(--text-main);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
}
.field input:focus{outline:none;border-color:var(--gold);}
.field input::placeholder{color:#5b5e80;}
.time-unknown{
  display:flex;align-items:center;gap:8px;margin-top:5px;
  font-size:11.5px;color:var(--text-dim);
}
.time-unknown input{width:auto;}

.time-row{
  display:flex;
  align-items:center;
  gap:6px;
}
.time-select{
  background:var(--bg-card-2);
  border:0.5px solid var(--line);
  border-radius:8px;
  padding:9px 8px;
  color:var(--text-main);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  flex:1;
  min-width:0;
}
.time-select:focus{outline:none;border-color:var(--gold);}
.time-ampm{flex:1.1;}
.time-colon{color:var(--text-dim);font-size:14px;}

.orbit-zone{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0 12px;
}
.orbit-btn{
  background:rgba(232,184,96,0.06);
  border:1.5px solid var(--gold);
  border-radius:100px;
  cursor:pointer;
  width:170px;height:100px;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.2s, box-shadow 0.2s, transform 0.15s;
  box-shadow:0 0 0 0 rgba(232,184,96,0.0);
}
.orbit-btn:hover{
  background:rgba(232,184,96,0.14);
  box-shadow:0 0 22px 2px rgba(232,184,96,0.25);
  transform:translateY(-1px);
}
.orbit-btn:active{transform:translateY(0px) scale(0.98);}
.orbit-btn svg{width:88%;height:88%;overflow:visible;}
.orbit-btn:hover .venus-glyph{filter:drop-shadow(0 0 6px var(--gold));}
.orbit-btn:disabled{opacity:0.4;cursor:not-allowed;}
.orbit-btn:disabled:hover{box-shadow:none;transform:none;background:rgba(232,184,96,0.06);}
.orbit-label{
  margin-top:12px;
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:500;
}
.error-msg{
  color:var(--rose);
  font-size:13px;
  margin-top:10px;
  text-align:center;
  min-height:18px;
}

.spin-active .venus-orbit-group{animation:spin-orbit 2.2s cubic-bezier(0.4,0,0.2,1);}
@keyframes spin-orbit{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(1080deg);}
}

#resultsView{display:none;}
.results-header{text-align:center;margin-bottom:8px;}
.results-header .names{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:26px;
  color:var(--text-main);
}
.results-header .names span{color:var(--rose);}

.recap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin:28px 0 8px;
}
@media(max-width:720px){.recap{grid-template-columns:1fr;}}
.recap-card{
  background:var(--bg-card);
  border:0.5px solid var(--line);
  border-radius:14px;
  padding:20px 22px;
}
.recap-card .who{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:4px;}
.recap-card .venus-sign{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;color:var(--gold);margin-bottom:10px;
}
.recap-card .meta{font-size:12px;color:var(--text-dim);line-height:1.7;}

.venus-banner{
  text-align:center;
  margin:36px 0 28px;
  font-family:'Cormorant Garamond',serif;
  font-size:20px;
  color:var(--text-dim);
}
.venus-banner b{color:var(--gold);font-weight:600;}

.section{margin-bottom:26px;}
.section h3{
  font-size:12px;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--rose);margin-bottom:10px;
}
.section p{
  font-size:15.5px;line-height:1.75;color:var(--text-main);
}

.back-btn{
  display:block;margin:40px auto 0;
  background:none;border:0.5px solid var(--line);
  color:var(--text-dim);border-radius:8px;
  padding:10px 20px;font-size:13px;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}

.missing-note{
  text-align:center;color:var(--text-dim);font-size:13px;
  margin-top:18px;line-height:1.6;
}
</style>
</head>
<body>

<div id="stars"></div>
<div id="milkyway"></div>

<div class="wrap">
  <h1>Venus Match</h1>
  <p class="subtitle">Everyone talks about Sun signs. Nobody talks about Venus — and Venus is the one that actually tells you how two people love.</p>
  <p class="privacy-note">Nothing you enter is stored or sent anywhere. Everything is calculated right here, in your browser.</p>

  <div id="formView" class="stage">
    <div class="people">
      <div class="person-card">
        <h2 id="p1Label">You</h2>
        <div class="field">
          <label>Name (first name or nickname is fine)</label>
          <input type="text" id="p1name" placeholder="First name or nickname" maxlength="40">
        </div>
        <div class="field">
          <label>Date of birth</label>
          <input type="date" id="p1date" min="1920-01-01" max="2035-12-31">
        </div>
        <div class="field">
          <label>Time of birth</label>
          <div class="time-row">
            <select id="p1hour" class="time-select"></select>
            <span class="time-colon">:</span>
            <select id="p1min" class="time-select"></select>
            <select id="p1ampm" class="time-select time-ampm">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
          <div class="time-unknown">
            <input type="checkbox" id="p1timeunknown">
            <label for="p1timeunknown" style="margin:0;text-transform:none;letter-spacing:normal;">I don't know the exact time</label>
          </div>
        </div>
        <div class="field">
          <label>Place of birth</label>
          <input type="text" id="p1place" placeholder="City, Country">
        </div>
      </div>

      <div class="orbit-zone">
        <button class="orbit-btn" id="submitBtn" onclick="runMatch()">
          <svg viewBox="0 0 180 120">
            <g class="venus-orbit-group" style="transform-origin:90px 60px;">
              <ellipse cx="90" cy="60" rx="55" ry="18" fill="none" stroke="#e8b86055" stroke-width="1" stroke-dasharray="2 4"/>
              <g class="venus-glyph" transform="translate(45,60)">
                <circle cx="0" cy="-6" r="16" fill="none" stroke="#e8b860" stroke-width="2.5"/>
                <line x1="0" y1="10" x2="0" y2="28" stroke="#e8b860" stroke-width="2.5"/>
                <line x1="-9" y1="22" x2="9" y2="22" stroke="#e8b860" stroke-width="2.5"/>
              </g>
              <g class="venus-glyph" transform="translate(135,60)">
                <circle cx="0" cy="-6" r="16" fill="none" stroke="#d68fa3" stroke-width="2.5"/>
                <line x1="0" y1="10" x2="0" y2="28" stroke="#d68fa3" stroke-width="2.5"/>
                <line x1="-9" y1="22" x2="9" y2="22" stroke="#d68fa3" stroke-width="2.5"/>
              </g>
            </g>
          </svg>
        </button>
        <div class="orbit-label">Reveal the match</div>
        <div class="error-msg" id="errorMsg"></div>
      </div>

      <div class="person-card">
        <h2 id="p2Label">Them</h2>
        <div class="field">
          <label>Name (first name or nickname is fine)</label>
          <input type="text" id="p2name" placeholder="First name or nickname" maxlength="40">
        </div>
        <div class="field">
          <label>Date of birth</label>
          <input type="date" id="p2date" min="1920-01-01" max="2035-12-31">
        </div>
        <div class="field">
          <label>Time of birth</label>
          <div class="time-row">
            <select id="p2hour" class="time-select"></select>
            <span class="time-colon">:</span>
            <select id="p2min" class="time-select"></select>
            <select id="p2ampm" class="time-select time-ampm">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
          <div class="time-unknown">
            <input type="checkbox" id="p2timeunknown">
            <label for="p2timeunknown" style="margin:0;text-transform:none;letter-spacing:normal;">I don't know the exact time</label>
          </div>
        </div>
        <div class="field">
          <label>Place of birth</label>
          <input type="text" id="p2place" placeholder="City, Country">
        </div>
      </div>
    </div>
  </div>

  <div id="resultsView">
    <div class="results-header">
      <div class="names" id="resultNames"></div>
    </div>

    <div class="recap">
      <div class="recap-card">
        <div class="who" id="recap1who"></div>
        <div class="venus-sign" id="recap1venus"></div>
        <div class="meta" id="recap1meta"></div>
      </div>
      <div class="recap-card">
        <div class="who" id="recap2who"></div>
        <div class="venus-sign" id="recap2venus"></div>
        <div class="meta" id="recap2meta"></div>
      </div>
    </div>

    <div class="venus-banner" id="venusBanner"></div>

    <div id="compatContent"></div>
    <div id="missingNote" class="missing-note" style="display:none;"></div>

    <button class="back-btn" onclick="goBack()">Start over</button>
  </div>
</div>

const COMPAT_DATA = {"Aries|Aries":{"opening":"Two people who love the same way: fast, hot, and completely without subtlety. Aries Venus doesn't simmer, it ignites. It wants to be chased and it wants to chase, it flirts like it's a competitive sport, and it falls for people quickly and completely. Put two of them together and you get instant chemistry, instant intensity, and zero patience for slow-burn romance. This is a pairing that either combusts into something incredible within the first month or burns out just as fast.","clicks":"Neither one has to translate their urgency to the other, because they share it. Both move fast, both are direct about what they want, both find slow, cautious courtship exhausting rather than romantic. There's a mutual respect for boldness here \u2014 an Aries Venus person is drawn to confidence, and they've found someone who has exactly as much of it as they do. Dates feel like adventures. Conflict, when it happens, gets resolved quickly because neither one is interested in sulking or playing games. It's over as fast as it started, for better and for worse.","strains":"Two Aries Venuses in the same relationship means two people used to leading, not following, and neither one is naturally built for compromise. Both want to be the one who initiates, who decides where the date happens, who sets the pace of the relationship. That's a lot of friction when nobody wants the passenger seat. The bigger risk is that Aries Venus loves the chase more than the having \u2014 once the initial thrill cools, both partners might independently start wondering if the spark is gone, without either one being willing to be the one to slow down and actually work on it.","real_test":"This pairing survives on whether both people can learn to enjoy the plateau, not just the climb. Aries Venus is genuinely excellent at the beginning of things \u2014 the flirtation, the pursuit, the electric first few months \u2014 but relationships eventually require sitting still together, and that's the muscle neither partner has built. The real test comes the first time the excitement dips: does one of them reach for a fight just to feel something again, or does one of them simply drift toward a new spark somewhere else? If both partners can consciously choose to keep choosing each other after the initial fire settles into something steadier, this becomes a relationship with real electricity that never quite goes out. If neither can, it ends exactly as fast as it began."},"Aries|Taurus":{"opening":"Fire meets earth, and it's a genuinely useful collision. Aries Venus loves through pursuit, spontaneity, and heat \u2014 it wants to move fast and feel the thrill of newness. Taurus Venus loves through steadiness, sensuality, and time \u2014 it wants to build something slow and savor every part of it. On the surface these look incompatible, but there's an old pairing logic here: Aries brings the spark, Taurus brings the fuel that keeps it burning longer than Aries could manage alone.","clicks":"Aries is drawn to Taurus's calm, grounded confidence \u2014 someone who doesn't need to be chased because they already know their own worth, which is oddly magnetic to a sign that loves a challenge. Taurus, in turn, finds Aries's directness refreshing after a lifetime of overthinking; there's something relieving about a partner who just says what they want. Physically this pairing tends to have real heat, since both signs are deeply sensual, just expressed at different speeds. When it works, Aries teaches Taurus to leap sometimes, and Taurus teaches Aries that some things are worth waiting for.","strains":"The core friction is pace. Aries wants to move now \u2014 decide now, plan the trip now, escalate the relationship now. Taurus needs time to feel secure before committing to anything, and rushing makes it dig its heels in rather than speed up. Aries can read this as disinterest or coldness; Taurus can read Aries's urgency as reckless or even a little disrespectful of its own process. Stubbornness is the other landmine: both signs, in different ways, hate being told what to do, and neither backs down easily once dug in, which can turn small disagreements into standoffs neither wants.","real_test":"The test here is about tempo, not compatibility of feeling \u2014 both signs genuinely can love each other deeply, the question is whether Aries can learn that Taurus's slowness is not rejection but is actually how Taurus loves, and whether Taurus can learn that Aries's impatience is not carelessness but is how Aries expresses excitement. If Aries can slow its footsteps just enough for Taurus to catch up, and Taurus can occasionally leap without needing every guarantee first, this pairing builds something with real staying power \u2014 heat that Taurus's steadiness keeps from ever fully burning out, and stability that Aries's fire keeps from ever going stale."},"Taurus|Taurus":{"opening":"Two people who love the exact same way, at the exact same speed, which is either the most restful relationship in the zodiac or the slowest-moving one. Taurus Venus loves through consistency, physical affection, good food, and comfort \u2014 it wants a partner who isn't going anywhere and isn't asking for anything performative. Two of them together skip the entire negotiation over pacing that plagues most pairings, because neither one is in a hurry for anything.","clicks":"This is one of the most naturally comfortable Venus pairings there is. Both partners value the same things: reliability, sensual pleasure, a well-kept home, financial security, physical touch. Nobody has to explain why they need routine, or defend wanting to stay in instead of going out, or justify taking things slow. There's a shared appreciation for the good things in life \u2014 a nice meal, a comfortable bed, quality over quantity in everything \u2014 that makes daily life together feel indulgent rather than mundane. Trust builds early because neither partner is inclined toward games or sudden shifts.","strains":"The risk with two Taurus Venuses is stagnation, not conflict. Both partners are so comfortable with the status quo that neither one pushes the relationship to grow, try new things, or leave the routine that's become safe. Stubbornness compounds this \u2014 when disagreements do happen, over money, over change, over who's being more inflexible, neither partner backs down easily, and standoffs can last a genuinely long time because giving in doesn't come naturally to this sign. There's also a risk of possessiveness on both sides; Taurus Venus can be quietly jealous, and two of them together can create a relationship that's secure but a little insular.","real_test":"The test isn't whether these two can build a stable life together \u2014 they will, almost automatically. The test is whether they can resist the gravitational pull toward total sameness, toward never being surprised, toward mistaking comfort for the whole relationship. Taurus Venus needs to occasionally be pulled out of its own routine to stay alive to the relationship rather than just familiar with it, and with two Taurus partners, neither one naturally provides that push. If both partners can consciously introduce small moments of novelty \u2014 a new place, a spontaneous decision, an actual difficult conversation instead of comfortable silence \u2014 this becomes one of the most enduring pairings in the zodiac. If neither does, it's stable, warm, and very slowly loses its pulse."},"Cancer|Capricorn":{"opening":"One loves by nurturing, the other loves by providing. Cancer Venus shows affection through emotional presence, caretaking, and creating a soft place to land \u2014 it wants to feel close, to check in, to be let all the way inside someone's inner world. Capricorn Venus shows affection through commitment, reliability, and building something that lasts \u2014 it wants to prove love through action, not through words, and often distrusts declarations that aren't backed up by follow-through. On paper, these are two people who both take love seriously and don't do casual. Neither is interested in something that doesn't go somewhere, and that shared seriousness is the foundation everything else gets built on.","clicks":"Both signs are slow to trust and deeply loyal once they commit. Cancer's warmth softens Capricorn's guardedness \u2014 gives it permission to be tender in a way it doesn't often allow itself. Capricorn's steadiness gives Cancer the security it's always quietly looking for, the sense that the ground isn't going to shift under it. Neither one is going anywhere once they're in. This pairing tends to build real, durable structures together \u2014 a home, a family, a long financial and emotional life \u2014 rather than short flings or dramatic on-again-off-again cycles. There's an old-soul quality to it; it can feel less like dating and more like building a life alongside someone from very early on.","strains":"Cancer wants emotional expression \u2014 check-ins, reassurance, physical affection, being asked how it's actually doing. Capricorn shows love through action (paying the bills, showing up on time, solving the problem quietly before anyone even noticed it) and can read Cancer's need for verbal reassurance as excessive, or even a little exhausting on a hard week. Cancer, in turn, can experience Capricorn's practicality as cold or withholding, even when Capricorn is fully committed underneath it and would be devastated to lose the relationship. The core conflict is a translation problem, not a caring problem: Cancer feels loved through words and presence, Capricorn feels loved through reliability and results, and each can quietly misread the other's love language as an absence of love rather than just a different dialect of it.","real_test":"This pairing lives or dies on whether both people learn to translate, not just tolerate. Capricorn has to learn that saying the feeling out loud \u2014 even once, even awkwardly \u2014 lands harder with Cancer than another grand gesture of competence ever will; silence, to Cancer, reads as distance even when Capricorn means it as strength. Cancer has to learn to actually see Capricorn's steadiness as the love language it is, instead of waiting for a version of affection that looks more like its own. The danger moment is usually a stretch of stress, when Capricorn goes quiet and heads-down exactly when Cancer needs reassurance most, and Cancer reaches for more closeness exactly when Capricorn wants space to just handle it. If both partners recognize that pattern for what it is rather than taking it personally, this becomes one of the most genuinely durable Venus pairings there is \u2014 two people who fight to stay rather than fight to leave."},"Gemini|Sagittarius":{"opening":"Opposite signs, same appetite for freedom. Gemini Venus loves through conversation, variety, and mental play \u2014 it needs a partner who can keep up in a debate, follow a tangent, and never bore it with routine. Sagittarius Venus loves through adventure, honesty, and expansion \u2014 it needs a partner who won't clip its wings or demand it stay in one place, physically or philosophically, for too long. Neither one is looking for a cage, and neither one is likely to build one, which is exactly what makes this pairing feel so easy at first.","clicks":"This is one of the most naturally fun Venus pairings there is. Both partners are curious, quick, and allergic to boredom, so conversation never runs dry and neither one has to perform enthusiasm they don't feel. Gemini brings wit and range; Sagittarius brings big-picture optimism and a taste for the unknown. Neither one is possessive or clingy by nature, so the relationship tends to feel light rather than heavy, full of shared jokes, spontaneous plans, and a mutual understanding that love doesn't have to mean constant togetherness to be real. Trust is built through honesty rather than reassurance, which suits both of them fine.","strains":"The very freedom that makes this pairing fun can also make it hard to pin down. Both signs can struggle with commitment, not because they don't feel deeply, but because neither one naturally slows down long enough to build the deeper layers a relationship eventually needs. Gemini can flit toward the next interesting conversation, Sagittarius toward the next literal or metaphorical trip, and if neither one is anchoring the relationship, it can stay pleasant and surface-level indefinitely. Sagittarius's bluntness can also land harder on Gemini than intended \u2014 Gemini processes through talking things through, while Sagittarius sometimes says the blunt true thing and considers the matter closed.","real_test":"The real test is whether this pairing can choose depth without feeling like it's choosing a cage. Neither partner responds well to guilt, obligation, or pressure to \"get serious,\" so the relationship has to grow through genuine desire rather than convention \u2014 which is possible, but requires both people to actually want to build something, not just enjoy the ride. Gemini has to resist treating hard conversations like just another topic to move past quickly, and Sagittarius has to resist treating commitment like a loss of freedom rather than a choice it's making, again, every day. If both partners can find a version of depth that still feels like air rather than weight, this becomes a relationship that's rare in the zodiac: genuinely fun for the long haul, not just the beginning."},"Cancer|Gemini":{"opening":"One loves by feeling, the other loves by talking. Cancer Venus shows affection through emotional depth, memory, and closeness \u2014 it wants to hold hands with someone's inner world, to be trusted with the soft parts, to build a private universe of in-jokes and rituals over time. Gemini Venus shows affection through curiosity, banter, and movement \u2014 it wants a partner who's endlessly interesting to talk to, who doesn't need every feeling spelled out, who can ride the current of a conversation wherever it goes. These two are speaking different love dialects from day one, and whether that becomes charming or exhausting depends entirely on how much either one is willing to learn the other's language.","clicks":"Gemini brings lightness Cancer doesn't always give itself permission to have \u2014 a way of turning a heavy day into a joke, of keeping things playful when Cancer would otherwise sink into its own feelings. Cancer brings a kind of emotional attentiveness Gemini rarely receives \u2014 someone who actually remembers what was said three weeks ago, who notices the mood shift before it's spoken. There's real charm here: Gemini's wit paired with Cancer's warmth can make for a relationship that's both fun and tender, chatty dinners that turn into real conversations, a partner who makes Cancer laugh and a partner who makes Gemini feel actually known rather than just entertaining.","strains":"Cancer needs consistency and emotional check-ins; Gemini needs variety and mental freedom, and can feel boxed in by too much processing or too many questions about \"where this is going.\" When Cancer reaches for reassurance, Gemini's instinct to lighten the mood or change the subject can land as dismissive, even when it's not meant that way. Meanwhile Gemini's natural sociability and need for space can trigger Cancer's deeper fear of being unimportant or easily replaced \u2014 Cancer notices distance and reads it as withdrawal of love, when for Gemini it's often just normal breathing room. Neither one is wrong about what they need; the problem is each one's normal is the other's warning sign.","real_test":"This pairing works if Gemini learns that Cancer's need for reassurance isn't clinginess, it's Cancer's actual love language, and a few consistent words of care go further here than any clever joke. And it works if Cancer learns that Gemini's need for lightness and space isn't evidence of lesser feeling, just a different rhythm of closeness \u2014 Gemini can be deeply loyal while still needing room to roam mentally and socially. The danger moment is a stretch where Cancer spirals into needing more closeness right as Gemini pulls back for air, each move confirming the other's worst fear. If both partners can catch that pattern and name it instead of react to it, this becomes a relationship with real range \u2014 deep enough to matter, light enough to never go stale."}};

// build starfield
(function(){
  const starsEl = document.getElementById('stars');

  const count = 200;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*1.6 + 0.5;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*5)+'s';
    s.style.animationDuration = (6+Math.random()*8)+'s';
    starsEl.appendChild(s);
  }

  // a few larger, closer-looking dots
  const bigCount = 4;
  for(let i=0;i<bigCount;i++){
    const s = document.createElement('div');
    s.className = 'star star-close';
    const size = Math.random()*1.8 + 3.2;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*5)+'s';
    s.style.animationDuration = (7+Math.random()*7)+'s';
    starsEl.appendChild(s);
  }

  function spawnComet(){
    const wrap = document.createElement('div');
    wrap.style.position = 'absolute';

    // Always travel true corner to opposite corner, picking one of two diagonals at random
    const topLeftToBottomRight = Math.random() < 0.5;
    const startX = topLeftToBottomRight ? -5 : 105;
    const startY = -5;
    const angle = topLeftToBottomRight ? 45 : 135; // degrees: 45 = down-right, 135 = down-left

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const dist = Math.sqrt(vw*vw + vh*vh) * 1.15; // straight-line travel distance along the rotated axis, covers full diagonal

    wrap.style.left = startX+'vw';
    wrap.style.top = startY+'vh';
    wrap.style.transform = 'rotate('+angle+'deg)';

    const c = document.createElement('div');
    c.className = 'comet';
    c.style.setProperty('--dist', dist+'px');
    const dur = 2.4 + Math.random()*1.0;
    c.style.animationDuration = dur+'s';

    wrap.appendChild(c);
    starsEl.appendChild(wrap);
    setTimeout(()=>wrap.remove(), dur*1000 + 200);
  }

  function scheduleComet(){
    const delay = 4000 + Math.random()*7000;
    setTimeout(()=>{ spawnComet(); scheduleComet(); }, delay);
  }
  scheduleComet();

  function spawnUFO(){
    const leftToRight = Math.random() < 0.5;
    const y = 8 + Math.random()*55; // vertical position, upper-to-mid screen
    const w = 74;

    const wrap = document.createElement('div');
    wrap.style.position = 'absolute';
    wrap.style.top = y+'vh';
    wrap.style.left = leftToRight ? '-100px' : '';
    wrap.style.right = leftToRight ? '' : '-100px';
    wrap.style.width = w+'px';
    wrap.style.zIndex = '1';
    wrap.style.animation = 'ufo-fly '+(leftToRight?'normal':'reverse')+' 9s linear';

    const inner = document.createElement('div');
    if(!leftToRight){ inner.style.transform = 'scaleX(-1)'; }

    inner.innerHTML = `<svg viewBox="0 0 74 40" width="74" height="40" style="display:block;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,255,255,0.55)) drop-shadow(0 0 12px rgba(255,255,255,0.3));">
      <ellipse cx="37" cy="16" rx="13" ry="10" fill="#fff" opacity="0.75"/>
      <ellipse cx="37" cy="16" rx="13" ry="10" fill="none" stroke="#080a1c" stroke-width="1" opacity="0.4"/>
      <ellipse cx="37" cy="24" rx="34" ry="7" fill="#fff" opacity="0.8"/>
      <ellipse cx="37" cy="24" rx="34" ry="7" fill="none" stroke="#080a1c" stroke-width="1" opacity="0.4"/>
      <circle cx="20" cy="24" r="2" fill="#080a1c" opacity="0.45"/>
      <circle cx="30" cy="26" r="2" fill="#080a1c" opacity="0.45"/>
      <circle cx="44" cy="26" r="2" fill="#080a1c" opacity="0.45"/>
      <circle cx="54" cy="24" r="2" fill="#080a1c" opacity="0.45"/>
      <polygon points="24,29 50,29 40,44 34,44" fill="#fff" opacity="0.14"/>
    </svg>`;

    wrap.appendChild(inner);

    starsEl.appendChild(wrap);
    setTimeout(()=>wrap.remove(), 9200);
  }

  function scheduleUFO(){
    const delay = 55000 + Math.random()*10000; // roughly once a minute
    setTimeout(()=>{ spawnUFO(); scheduleUFO(); }, delay);
  }
  scheduleUFO();
})();

function venusSignForDate(dateStr){
  // dateStr: 'YYYY-MM-DD'
  let result = null;
  for(const t of VENUS_TRANSITIONS){
    if(t.date <= dateStr){ result = t.sign; } else { break; }
  }
  return result;
}

function populateTimeSelects(){
  ['p1hour','p2hour'].forEach(id=>{
    const el = document.getElementById(id);
    for(let h=1; h<=12; h++){
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h;
      el.appendChild(opt);
    }
  });
  ['p1min','p2min'].forEach(id=>{
    const el = document.getElementById(id);
    for(let m=0; m<60; m++){
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = String(m).padStart(2,'0');
      el.appendChild(opt);
    }
  });
}
populateTimeSelects();

function pairKey(signA, signB){
  const order = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
  const a = order.indexOf(signA), b = order.indexOf(signB);
  return a <= b ? signA+"|"+signB : signB+"|"+signA;
}

function validate(){
  const p1name = document.getElementById('p1name').value.trim();
  const p2name = document.getElementById('p2name').value.trim();
  const p1date = document.getElementById('p1date').value;
  const p2date = document.getElementById('p2date').value;
  const errorEl = document.getElementById('errorMsg');
  errorEl.textContent = '';

  if(!p1name || !p2name){
    errorEl.textContent = 'Both names are needed — even just an initial works.';
    return null;
  }
  if(!p1date || !p2date){
    errorEl.textContent = 'Both dates of birth are needed to find Venus.';
    return null;
  }
  return {p1name,p2name,p1date,p2date};
}

function runMatch(){
  const data = validate();
  if(!data) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.classList.add('spin-active');

  setTimeout(()=>{
    showResults(data);
    btn.classList.remove('spin-active');
    btn.disabled = false;
  }, 2200);
}

function showResults(data){
  const p1venus = venusSignForDate(data.p1date);
  const p2venus = venusSignForDate(data.p2date);
  const p1place = document.getElementById('p1place').value.trim();
  const p2place = document.getElementById('p2place').value.trim();
  const p1timeUnknown = document.getElementById('p1timeunknown').checked;
  const p2timeUnknown = document.getElementById('p2timeunknown').checked;
  const p1timeStr = p1timeUnknown ? '' : (document.getElementById('p1hour').value+':'+String(document.getElementById('p1min').value).padStart(2,'0')+' '+document.getElementById('p1ampm').value);
  const p2timeStr = p2timeUnknown ? '' : (document.getElementById('p2hour').value+':'+String(document.getElementById('p2min').value).padStart(2,'0')+' '+document.getElementById('p2ampm').value);

  document.getElementById('resultNames').innerHTML =
    data.p1name + ' <span>&amp;</span> ' + data.p2name;

  document.getElementById('recap1who').textContent = data.p1name;
  document.getElementById('recap1venus').textContent = 'Venus in ' + p1venus;
  document.getElementById('recap1meta').innerHTML =
    formatDate(data.p1date) + (p1timeUnknown? ' &middot; time unknown' : (p1timeStr? ' &middot; '+p1timeStr:'')) + (p1place? '<br>'+escapeHtml(p1place):'');

  document.getElementById('recap2who').textContent = data.p2name;
  document.getElementById('recap2venus').textContent = 'Venus in ' + p2venus;
  document.getElementById('recap2meta').innerHTML =
    formatDate(data.p2date) + (p2timeUnknown? ' &middot; time unknown' : (p2timeStr? ' &middot; '+p2timeStr:'')) + (p2place? '<br>'+escapeHtml(p2place):'');

  document.getElementById('venusBanner').innerHTML =
    data.p1name + '\'s Venus in <b>'+p1venus+'</b> meets '+data.p2name+'\'s Venus in <b>'+p2venus+'</b>';

  const key = pairKey(p1venus, p2venus);
  const entry = COMPAT_DATA[key];
  const contentEl = document.getElementById('compatContent');
  const missingEl = document.getElementById('missingNote');

  if(entry){
    contentEl.style.display = 'block';
    missingEl.style.display = 'none';
    contentEl.innerHTML = `
      <div class="section"><p>${entry.opening}</p></div>
      <div class="section"><h3>Where it clicks</h3><p>${entry.clicks}</p></div>
      <div class="section"><h3>Where it strains</h3><p>${entry.strains}</p></div>
      <div class="section"><h3>The real test</h3><p>${entry.real_test}</p></div>
    `;
  } else {
    contentEl.style.display = 'none';
    missingEl.style.display = 'block';
    missingEl.textContent = 'The full write-up for ' + p1venus + ' + ' + p2venus + ' is still being written \u2014 check back soon.';
  }

  document.getElementById('formView').style.display = 'none';
  document.getElementById('resultsView').style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function goBack(){
  document.getElementById('resultsView').style.display = 'none';
  document.getElementById('formView').style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function formatDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
