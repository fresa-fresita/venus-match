<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Match — find out where your Venus really stands</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg-deep:#080a1c;
  --bg-card:#141833;
  --bg-card-2:#1c2144;
  --text-main:#f0eef7;
  --text-dim:#a6a8c4;
  --gold:#e8b860;
  --rose:#d68fa3;
  --line:rgba(232,184,96,0.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg-deep);
  color:var(--text-main);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}

#milkyway{
  position:fixed;inset:-20%;z-index:0;pointer-events:none;overflow:hidden;
}
#milkyway::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:180vmax;height:38vmax;
  transform:translate(-50%,-50%) rotate(-22deg);
  background:linear-gradient(90deg,
    rgba(180,170,220,0) 0%,
    rgba(190,180,230,0.05) 12%,
    rgba(210,195,235,0.09) 30%,
    rgba(225,210,240,0.11) 50%,
    rgba(210,195,235,0.09) 70%,
    rgba(190,180,230,0.05) 88%,
    rgba(180,170,220,0) 100%
  );
  filter:blur(18px);
  opacity:0.5;
}
#milkyway::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:170vmax;height:16vmax;
  transform:translate(-50%,-50%) rotate(-22deg);
  background:linear-gradient(90deg,
    rgba(232,184,96,0) 0%,
    rgba(232,184,96,0.04) 20%,
    rgba(214,143,163,0.06) 50%,
    rgba(232,184,96,0.04) 80%,
    rgba(232,184,96,0) 100%
  );
  filter:blur(30px);
  opacity:0.6;
}
.star{
  position:absolute;background:#fff;border-radius:50%;
  animation:twinkle ease-in-out infinite;
  box-shadow:0 0 4px 1px rgba(255,255,255,0.6);
}
.star-close{
  box-shadow:0 0 10px 3px rgba(255,255,255,0.75), 0 0 18px 6px rgba(232,184,96,0.25);
}
@keyframes twinkle{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}

.comet{
  position:relative;
  width:4px;height:4px;
  background:#fff;
  image-rendering:pixelated;
  box-shadow:
    -4px 0 0 0 #fff,
    -8px 0 0 0 #e8e6f5,
    -12px 0 0 0 #c7c4dd,
    -16px 0 0 0 #9a97b8,
    -20px 0 0 0 #6d6a8f,
    0 0 8px 2px rgba(255,255,255,0.8);
  animation:comet-fly linear forwards;
}
@keyframes comet-fly{
  0%{transform:translateX(0);opacity:0;}
  8%{opacity:1;}
  85%{opacity:1;}
  100%{transform:translateX(var(--dist));opacity:0;}
}

@keyframes ufo-fly{
  0%{transform:translate(0,0);opacity:0;}
  6%{opacity:1;}
  25%{transform:translate(28vw,-2vh);}
  50%{transform:translate(56vw,2vh);}
  75%{transform:translate(84vw,-1.5vh);}
  94%{opacity:1;}
  100%{transform:translate(115vw,0);opacity:0;}
}

.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:40px 24px 60px;min-height:100vh;display:flex;flex-direction:column;}

h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  font-size:clamp(26px,3.4vw,38px);
  text-align:center;
  letter-spacing:0.01em;
  background:linear-gradient(180deg,#fff,var(--gold));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{
  text-align:center;
  color:var(--text-dim);
  font-size:13.5px;
  max-width:520px;
  margin:8px auto 0;
  line-height:1.5;
}
.privacy-note{
  text-align:center;
  color:var(--text-dim);
  font-size:11px;
  margin-top:6px;
  opacity:0.65;
}

.stage{
  position:relative;
  margin-top:auto;
  margin-bottom:auto;
  flex:1;
  display:flex;
  align-items:center;
}

.people{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:28px;
  align-items:center;
  width:100%;
}
@media(max-width:860px){
  .people{grid-template-columns:1fr;}
  .orbit-zone{order:3;padding:20px 0;}
}

.person-card{
  background:var(--bg-card);
  border:0.5px solid var(--line);
  border-radius:16px;
  padding:22px 22px;
}
.person-card h2{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-style:italic;
  font-size:20px;
  color:var(--rose);
  margin-bottom:16px;
}
.field{margin-bottom:12px;}
.field label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--text-dim);
  margin-bottom:5px;
}
.field input{
  width:100%;
  background:var(--bg-card-2);
  border:0.5px solid var(--line);
  border-radius:8px;
  padding:9px 12px;
  color:var(--text-main);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
}
.field input:focus{outline:none;border-color:var(--gold);}
.field input::placeholder{color:#5b5e80;}
.time-unknown{
  display:flex;align-items:center;gap:8px;margin-top:5px;
  font-size:11.5px;color:var(--text-dim);
}
.time-unknown input{width:auto;}

.time-row{
  display:flex;
  align-items:center;
  gap:6px;
}
.time-select{
  background:var(--bg-card-2);
  border:0.5px solid var(--line);
  border-radius:8px;
  padding:9px 8px;
  color:var(--text-main);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  flex:1;
  min-width:0;
}
.time-select:focus{outline:none;border-color:var(--gold);}
.time-ampm{flex:1.1;}
.time-colon{color:var(--text-dim);font-size:14px;}

.orbit-zone{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0 12px;
}
.orbit-btn{
  background:rgba(232,184,96,0.06);
  border:1.5px solid var(--gold);
  border-radius:100px;
  cursor:pointer;
  width:170px;height:100px;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.2s, box-shadow 0.2s, transform 0.15s;
  box-shadow:0 0 0 0 rgba(232,184,96,0.0);
}
.orbit-btn:hover{
  background:rgba(232,184,96,0.14);
  box-shadow:0 0 22px 2px rgba(232,184,96,0.25);
  transform:translateY(-1px);
}
.orbit-btn:active{transform:translateY(0px) scale(0.98);}
.orbit-btn svg{width:88%;height:88%;overflow:visible;}
.orbit-btn:hover .venus-glyph{filter:drop-shadow(0 0 6px var(--gold));}
.orbit-btn:disabled{opacity:0.4;cursor:not-allowed;}
.orbit-btn:disabled:hover{box-shadow:none;transform:none;background:rgba(232,184,96,0.06);}
.orbit-label{
  margin-top:12px;
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:500;
}
.error-msg{
  color:var(--rose);
  font-size:13px;
  margin-top:10px;
  text-align:center;
  min-height:18px;
}

.spin-active .venus-orbit-group{animation:spin-orbit 2.2s cubic-bezier(0.4,0,0.2,1);}
@keyframes spin-orbit{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(1080deg);}
}

#resultsView{display:none;}
.results-header{text-align:center;margin-bottom:8px;}
.results-header .names{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:26px;
  color:var(--text-main);
}
.results-header .names span{color:var(--rose);}

.recap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin:28px 0 8px;
}
@media(max-width:720px){.recap{grid-template-columns:1fr;}}
.recap-card{
  background:var(--bg-card);
  border:0.5px solid var(--line);
  border-radius:14px;
  padding:20px 22px;
}
.recap-card .who{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:4px;}
.recap-card .venus-sign{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;color:var(--gold);margin-bottom:10px;
}
.recap-card .meta{font-size:12px;color:var(--text-dim);line-height:1.7;}

.venus-banner{
  text-align:center;
  margin:36px 0 28px;
  font-family:'Cormorant Garamond',serif;
  font-size:20px;
  color:var(--text-dim);
}
.venus-banner b{color:var(--gold);font-weight:600;}

.section{margin-bottom:26px;}
.section h3{
  font-size:12px;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--rose);margin-bottom:10px;
}
.section p{
  font-size:15.5px;line-height:1.75;color:var(--text-main);
}

.back-btn{
  display:block;margin:40px auto 0;
  background:none;border:0.5px solid var(--line);
  color:var(--text-dim);border-radius:8px;
  padding:10px 20px;font-size:13px;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}

.missing-note{
  text-align:center;color:var(--text-dim);font-size:13px;
  margin-top:18px;line-height:1.6;
}
</style>
</head>
<body>

<div id="stars"></div>
<div id="milkyway"></div>

<div class="wrap">
  <h1>Venus Match</h1>
  <p class="subtitle">Everyone talks about Sun signs. Nobody talks about Venus — and Venus is the one that actually tells you how two people love.</p>
  <p class="privacy-note">Nothing you enter is stored or sent anywhere. Everything is calculated right here, in your browser.</p>

  <div id="formView" class="stage">
    <div class="people">
      <div class="person-card">
        <h2 id="p1Label">You</h2>
        <div class="field">
          <label>Name (first name or nickname is fine)</label>
          <input type="text" id="p1name" placeholder="First name or nickname" maxlength="40">
        </div>
        <div class="field">
          <label>Date of birth</label>
          <input type="date" id="p1date" min="1920-01-01" max="2035-12-31">
        </div>
        <div class="field">
          <label>Time of birth</label>
          <div class="time-row">
            <select id="p1hour" class="time-select"></select>
            <span class="time-colon">:</span>
            <select id="p1min" class="time-select"></select>
            <select id="p1ampm" class="time-select time-ampm">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
          <div class="time-unknown">
            <input type="checkbox" id="p1timeunknown">
            <label for="p1timeunknown" style="margin:0;text-transform:none;letter-spacing:normal;">I don't know the exact time</label>
          </div>
        </div>
        <div class="field">
          <label>Place of birth</label>
          <input type="text" id="p1place" placeholder="City, Country">
        </div>
      </div>

      <div class="orbit-zone">
        <button class="orbit-btn" id="submitBtn" onclick="runMatch()">
          <svg viewBox="0 0 180 120">
            <g class="venus-orbit-group" style="transform-origin:90px 60px;">
              <ellipse cx="90" cy="60" rx="55" ry="18" fill="none" stroke="#e8b86055" stroke-width="1" stroke-dasharray="2 4"/>
              <g class="venus-glyph" transform="translate(45,60)">
                <circle cx="0" cy="-6" r="16" fill="none" stroke="#e8b860" stroke-width="2.5"/>
                <line x1="0" y1="10" x2="0" y2="28" stroke="#e8b860" stroke-width="2.5"/>
                <line x1="-9" y1="22" x2="9" y2="22" stroke="#e8b860" stroke-width="2.5"/>
              </g>
              <g class="venus-glyph" transform="translate(135,60)">
                <circle cx="0" cy="-6" r="16" fill="none" stroke="#d68fa3" stroke-width="2.5"/>
                <line x1="0" y1="10" x2="0" y2="28" stroke="#d68fa3" stroke-width="2.5"/>
                <line x1="-9" y1="22" x2="9" y2="22" stroke="#d68fa3" stroke-width="2.5"/>
              </g>
            </g>
          </svg>
        </button>
        <div class="orbit-label">Reveal the match</div>
        <div class="error-msg" id="errorMsg"></div>
      </div>

      <div class="person-card">
        <h2 id="p2Label">Them</h2>
        <div class="field">
          <label>Name (first name or nickname is fine)</label>
          <input type="text" id="p2name" placeholder="First name or nickname" maxlength="40">
        </div>
        <div class="field">
          <label>Date of birth</label>
          <input type="date" id="p2date" min="1920-01-01" max="2035-12-31">
        </div>
        <div class="field">
          <label>Time of birth</label>
          <div class="time-row">
            <select id="p2hour" class="time-select"></select>
            <span class="time-colon">:</span>
            <select id="p2min" class="time-select"></select>
            <select id="p2ampm" class="time-select time-ampm">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
          <div class="time-unknown">
            <input type="checkbox" id="p2timeunknown">
            <label for="p2timeunknown" style="margin:0;text-transform:none;letter-spacing:normal;">I don't know the exact time</label>
          </div>
        </div>
        <div class="field">
          <label>Place of birth</label>
          <input type="text" id="p2place" placeholder="City, Country">
        </div>
      </div>
    </div>
  </div>

  <div id="resultsView">
    <div class="results-header">
      <div class="names" id="resultNames"></div>
    </div>

    <div class="recap">
      <div class="recap-card">
        <div class="who" id="recap1who"></div>
        <div class="venus-sign" id="recap1venus"></div>
        <div class="meta" id="recap1meta"></div>
      </div>
      <div class="recap-card">
        <div class="who" id="recap2who"></div>
        <div class="venus-sign" id="recap2venus"></div>
        <div class="meta" id="recap2meta"></div>
      </div>
    </div>

    <div class="venus-banner" id="venusBanner"></div>

    <div id="compatContent"></div>
    <div id="missingNote" class="missing-note" style="display:none;"></div>

    <button class="back-btn" onclick="goBack()">Start over</button>
  </div>
</div>

const COMPAT_DATA = {"Aries|Aries":{"opening":"Two people who love the same way: fast, hot, and completely without subtlety. Aries Venus doesn't simmer, it ignites. It wants to be chased and it wants to chase, it flirts like it's a competitive sport, and it falls for people quickly and completely. Put two of them together and you get instant chemistry, instant intensity, and zero patience for slow-burn romance. This is a pairing that either combusts into something incredible within the first month or burns out just as fast.","clicks":"Neither one has to translate their urgency to the other, because they share it. Both move fast, both are direct about what they want, both find slow, cautious courtship exhausting rather than romantic. There's a mutual respect for boldness here \u2014 an Aries Venus person is drawn to confidence, and they've found someone who has exactly as much of it as they do. Dates feel like adventures. Conflict, when it happens, gets resolved quickly because neither one is interested in sulking or playing games. It's over as fast as it started, for better and for worse.","strains":"Two Aries Venuses in the same relationship means two people used to leading, not following, and neither one is naturally built for compromise. Both want to be the one who initiates, who decides where the date happens, who sets the pace of the relationship. That's a lot of friction when nobody wants the passenger seat. The bigger risk is that Aries Venus loves the chase more than the having \u2014 once the initial thrill cools, both partners might independently start wondering if the spark is gone, without either one being willing to be the one to slow down and actually work on it.","real_test":"This pairing survives on whether both people can learn to enjoy the plateau, not just the climb. Aries Venus is genuinely excellent at the beginning of things \u2014 the flirtation, the pursuit, the electric first few months \u2014 but relationships eventually require sitting still together, and that's the muscle neither partner has built. The real test comes the first time the excitement dips: does one of them reach for a fight just to feel something again, or does one of them simply drift toward a new spark somewhere else? If both partners can consciously choose to keep choosing each other after the initial fire settles into something steadier, this becomes a relationship with real electricity that never quite goes out. If neither can, it ends exactly as fast as it began."},"Aries|Taurus":{"opening":"Fire meets earth, and it's a genuinely useful collision. Aries Venus loves through pursuit, spontaneity, and heat \u2014 it wants to move fast and feel the thrill of newness. Taurus Venus loves through steadiness, sensuality, and time \u2014 it wants to build something slow and savor every part of it. On the surface these look incompatible, but there's an old pairing logic here: Aries brings the spark, Taurus brings the fuel that keeps it burning longer than Aries could manage alone.","clicks":"Aries is drawn to Taurus's calm, grounded confidence \u2014 someone who doesn't need to be chased because they already know their own worth, which is oddly magnetic to a sign that loves a challenge. Taurus, in turn, finds Aries's directness refreshing after a lifetime of overthinking; there's something relieving about a partner who just says what they want. Physically this pairing tends to have real heat, since both signs are deeply sensual, just expressed at different speeds. When it works, Aries teaches Taurus to leap sometimes, and Taurus teaches Aries that some things are worth waiting for.","strains":"The core friction is pace. Aries wants to move now \u2014 decide now, plan the trip now, escalate the relationship now. Taurus needs time to feel secure before committing to anything, and rushing makes it dig its heels in rather than speed up. Aries can read this as disinterest or coldness; Taurus can read Aries's urgency as reckless or even a little disrespectful of its own process. Stubbornness is the other landmine: both signs, in different ways, hate being told what to do, and neither backs down easily once dug in, which can turn small disagreements into standoffs neither wants.","real_test":"The test here is about tempo, not compatibility of feeling \u2014 both signs genuinely can love each other deeply, the question is whether Aries can learn that Taurus's slowness is not rejection but is actually how Taurus loves, and whether Taurus can learn that Aries's impatience is not carelessness but is how Aries expresses excitement. If Aries can slow its footsteps just enough for Taurus to catch up, and Taurus can occasionally leap without needing every guarantee first, this pairing builds something with real staying power \u2014 heat that Taurus's steadiness keeps from ever fully burning out, and stability that Aries's fire keeps from ever going stale."},"Aries|Gemini":{"opening":"Two signs that move fast, just in different directions. Aries Venus loves through pursuit and directness \u2014 it wants to chase, decide, and act, with little patience for overthinking. Gemini Venus loves through conversation and mental agility \u2014 it wants to talk everything through, explore every angle, keep things moving mentally even when nothing's moving physically. Neither one does slow, cautious courtship, which means this pairing tends to ignite fast and run on pure momentum from day one.","clicks":"Both partners are quick, curious, and allergic to boredom, so there's rarely a dull moment between them \u2014 conversation crackles, plans happen spontaneously, and neither one has to drag the other into trying something new. Aries brings decisiveness Gemini sometimes lacks; Gemini brings range and wit that keeps Aries entertained well past the initial chase most partners fail to sustain its interest through. There's a genuine friendship-like ease here, two people who enjoy each other's company as much as any romantic spark, which gives the relationship real durability once it's established.","strains":"Aries wants to act on a decision once it's made; Gemini wants to keep discussing it, turning it over, exploring whether there's a better option, which can read to Aries as flakiness or a lack of commitment. Gemini, in turn, can find Aries's impatience for closure frustrating \u2014 not every question needs an immediate answer, and Aries pushing for one can feel like being rushed out of a conversation Gemini isn't done having. Both signs can also struggle with follow-through in their own ways, Aries losing interest once the chase ends, Gemini simply forgetting amid a dozen other threads, which can leave plans and even the relationship itself feeling less solid than the chemistry suggests.","real_test":"This pairing works if Aries can learn patience for Gemini's need to talk things through rather than treating it as stalling, and if Gemini can learn to actually land on decisions sometimes rather than keeping every option perpetually open. The real risk is two people who are excellent at starting things and less practiced at building something that requires steady follow-through. If both partners can channel their shared quickness into actually building momentum together, rather than each chasing their own separate direction, this becomes a genuinely fun, fast-moving partnership. If not, it burns bright and scatters just as quickly."},"Aries|Cancer":{"opening":"Fire meets water, and the collision is between armor and vulnerability. Aries Venus loves through boldness and directness \u2014 it says what it wants and moves toward it fast, with little patience for hurt feelings it didn't intend to cause. Cancer Venus loves through emotional depth and careful tending \u2014 it needs to feel safe before it opens up, and it bruises easily when a partner moves faster than its heart can keep pace with. This pairing can either teach Aries real tenderness or wear Cancer down before it ever gets the chance.","clicks":"Cancer is drawn to Aries's confidence and decisiveness \u2014 someone who knows what they want is genuinely magnetic to a sign that often second-guesses its own needs. Aries, in turn, can be quietly moved by how deeply Cancer cares, how much thought and feeling goes into even small gestures, once Cancer trusts enough to show it. There's real protective instinct in both signs, just expressed differently \u2014 Aries protects through action, Cancer through nurturing \u2014 and together that can make each partner feel genuinely looked after in a way neither expected.","strains":"Aries speaks first and processes later; Cancer processes for a long time before it's ready to speak at all, and the gap between those speeds causes real damage if neither adjusts. A blunt comment Aries has already forgotten by dinner can sit with Cancer for days, replayed and reinterpreted, while Cancer's need for reassurance and slow emotional pacing can read to Aries as neediness or drama it doesn't have patience for. Cancer's moods can also trigger Aries's impatience, and Aries's bluntness can trigger Cancer's retreat into its shell \u2014 a cycle that repeats unless someone names it.","real_test":"This pairing survives on whether Aries can learn to slow down its words around Cancer's more tender pace, and whether Cancer can learn that Aries's directness isn't cruelty, just a different, faster love language. Aries has to actively choose gentleness here, since it isn't the default setting; Cancer has to actively choose to voice hurt instead of quietly withdrawing from it. If Aries can become Cancer's fiercest protector rather than its accidental source of hurt, and Cancer can become the emotional depth Aries didn't know it needed, this pairing has real transformative potential. If neither adjusts, Cancer just learns to flinch."},"Aries|Leo":{"opening":"Two fire signs, both bold, both proud, both used to leading rather than following. Aries Venus loves through pursuit and directness \u2014 it moves fast, says what it wants, and doesn't wait around for permission. Leo Venus loves through warmth and grand generosity \u2014 it wants to be admired and wants to admire in return, with plenty of drama and celebration along the way. Together these two create real heat and real spectacle, a relationship that rarely feels boring, though it can also become a contest over whose fire burns brighter.","clicks":"Both partners share an appetite for boldness, romance, and living loudly, which means neither has to tone themselves down to keep the other comfortable. Aries's directness and confidence genuinely impresses Leo, who respects a partner unafraid to go after what it wants. Leo's warmth and generosity, in turn, make Aries feel celebrated in a way few other signs bother to offer. There's real passion here, in and out of the bedroom, and a shared willingness to make the relationship feel like an event rather than a routine.","strains":"Both signs want to lead, and neither is naturally built to follow, which means decisions, plans, and even conversations can turn into quiet contests over whose preference wins. Leo's need for admiration and attention can clash with Aries's own self-focus \u2014 Aries is used to being the one chasing and deciding, and Leo wanting the spotlight too can leave both partners competing for the same role rather than filling complementary ones. Pride compounds every disagreement, since neither one apologizes easily or wants to be the one who backs down first.","real_test":"This pairing thrives when both partners learn to take turns being the center of attention rather than each assuming it's their turn by default. Aries has to make room for Leo's need to be celebrated, not just chased; Leo has to make room for Aries's need for independence, not just admiration. If both can do that, the shared fire becomes fuel rather than friction \u2014 a relationship with real passion, real generosity, and real mutual respect. If neither learns to share the stage, it becomes two spotlights pointed outward instead of at each other."},"Aries|Virgo":{"opening":"Fire meets earth, and the meeting point is impulse versus precision. Aries Venus loves through speed and directness \u2014 it decides fast and acts faster, with little patience for overthinking a feeling into stillness. Virgo Venus loves through care and attention to detail \u2014 it wants to get things right, to think things through, to show love through quiet competence rather than bold declarations. These two can either balance each other beautifully or drive each other quietly up the wall, depending on how much patience each has for the other's completely different pace.","clicks":"Virgo brings a steadying, thoughtful presence that can actually improve Aries's impulsive decisions, offering a second, more careful set of eyes Aries doesn't naturally use on itself. Aries, in turn, can pull Virgo out of its own head and into action, encouraging it to leap sometimes instead of endlessly analyzing whether the moment is right. There's real complementary value here when it works \u2014 Aries brings momentum, Virgo brings refinement, and together they can actually build things neither would manage as effectively alone.","strains":"Aries's impulsiveness can read to Virgo as recklessness, a refusal to think things through that leaves Virgo anxious and cleaning up avoidable messes. Virgo's carefulness, in turn, can read to Aries as nitpicking or foot-dragging, a constant stream of caveats and corrections that saps the momentum Aries thrives on. Aries's bluntness can also wound Virgo's more sensitive, self-critical nature more than Aries intends, while Virgo's tendency to point out flaws can bruise Aries's pride faster than Virgo realizes.","real_test":"This pairing works if Aries can slow down just enough to actually hear Virgo's concerns as care rather than criticism, and if Virgo can loosen its grip just enough to let Aries move without a full risk assessment first. Neither partner needs to become the other, they just need enough patience to appreciate what the other's different pace actually offers. If both partners can do that, this becomes a genuinely productive, complementary pairing \u2014 Aries's courage matched with Virgo's precision. If neither adjusts, it becomes a running friction between someone who leaps and someone who double-checks everything before ever leaving the ground."},"Aries|Libra":{"opening":"Opposite signs, and the classic axis of self versus partnership. Aries Venus loves through directness and independence \u2014 it knows what it wants and pursues it without waiting for consensus. Libra Venus loves through harmony and consideration \u2014 it wants a true partnership, decisions made together, balance maintained at nearly any cost. Aries is drawn to what it lacks in itself, Libra's grace and diplomacy; Libra is drawn to what it lacks too, Aries's decisiveness and refusal to overthink. The attraction is real and immediate. The friction shows up once the relationship needs actual navigating.","clicks":"Libra softens Aries's rougher edges, teaching a bit of patience and consideration for how words land, while Aries gives Libra permission to just decide sometimes instead of endlessly weighing every option. There's real magnetism here \u2014 Aries's confidence draws Libra in, Libra's charm and warmth draw Aries in, and both signs share a genuine appreciation for romance, courtship, and making an effort for each other. When balanced, this pairing brings out real growth in both partners: Aries becomes more considerate, Libra becomes more decisive.","strains":"Aries wants to move fast and decide alone; Libra wants to slow down and decide together, and the friction between those two needs shows up in nearly every choice, from where to eat to bigger life decisions. Aries can find Libra's need for consensus indecisive or even passive, while Libra can find Aries's need for autonomy inconsiderate of the partnership it's supposed to be building. Aries's bluntness can also wound Libra's more diplomatic sensibility, and Libra's conflict-avoidance can frustrate Aries, who would rather have the fight and move on than watch a problem get smoothed over instead of solved.","real_test":"This pairing works if Aries learns that slowing down to actually include Libra in a decision isn't a loss of independence, and if Libra learns that voicing an honest, possibly unpopular opinion is more valuable to Aries than a diplomatically managed non-answer. Opposite signs often need each other precisely because they balance what the other lacks \u2014 the test is whether both partners experience that balance as growth or as constant compromise that never fully satisfies either one. Get the balance right, and this is one of the more classically complementary pairings in the zodiac. Get it wrong, and it's a tug-of-war neither one wins."},"Aries|Scorpio":{"opening":"Two signs that don't do anything halfway. Aries Venus loves through pursuit and directness \u2014 fast, obvious, no games, no hidden motives. Scorpio Venus loves through depth and intensity \u2014 slow to trust, but once committed, consuming and absolute. Both bring real passion to a relationship, just built on opposite instincts: Aries wants everything out in the open immediately, Scorpio wants to peel back layers slowly, on its own timeline, and not a moment sooner.","clicks":"There's real magnetism here \u2014 Aries's boldness draws Scorpio in, since Scorpio respects anyone unafraid to go after what they want without games. Scorpio's intensity, in turn, gives Aries something it doesn't always find: a partner who matches its passion pound for pound, who won't be overwhelmed by how much Aries feels or wants. Physically and emotionally, when this pairing ignites, it ignites completely \u2014 two people fully committed to the chase and, eventually, fully committed to each other.","strains":"Aries wants transparency now; Scorpio reveals itself in its own time, and Aries pushing for openness before Scorpio is ready can trigger exactly the guardedness Aries is trying to get past. Scorpio's jealousy and need for control can also clash hard with Aries's need for independence \u2014 Aries doesn't like being questioned or reined in, and Scorpio's suspicion, even when quiet, can read as a cage. Both signs hold grudges in their own way and neither backs down easily, which means real fights here can get genuinely intense rather than blow over quickly.","real_test":"This pairing works if Aries learns patience for Scorpio's slower trust-building, resisting the urge to force closeness before Scorpio's ready to give it, and if Scorpio learns to loosen its grip and trust Aries's directness as honesty rather than a threat to control. Both signs are capable of enormous loyalty once earned; the test is surviving the earning process without either one wounding the other's pride past the point of return. Done right, this is one of the most passionate, transformative pairings in the zodiac. Done wrong, it's combustible in the worst way."},"Aries|Sagittarius":{"opening":"Two fire signs who understand each other's need for movement almost instinctively. Aries Venus loves through pursuit and directness, wanting to chase and decide fast. Sagittarius Venus loves through freedom and honesty, wanting a partner who won't clip its wings or need constant reassurance. Together these two rarely feel stuck \u2014 this pairing tends to be full of adventure, spontaneity, and genuine excitement about where life might go next.","clicks":"Neither partner has to slow down for the other, and neither has to explain why independence matters so much, because both already live that way. There's an easy, adventurous chemistry here \u2014 spontaneous trips, blunt honest conversations, a shared refusal to be bored or boring. Sagittarius's optimism fuels Aries's confidence, and Aries's decisiveness gives Sagittarius's big ideas an actual engine to move on. Trust builds through honesty rather than reassurance, which suits both partners fine.","strains":"Both signs can struggle with follow-through and consistency \u2014 exciting starts are easy for both, sustained attention less so, and a relationship where neither partner anchors things can drift pleasantly without ever solidifying into something deeper. Bluntness is the other risk; both say the true thing without much cushioning, and two people doing that to each other can create wounds neither intended, especially since neither is naturally inclined to sit with a hurt feeling and process it slowly rather than move past it fast.","real_test":"This pairing works if both partners can choose to actually build something together, on purpose, rather than just enjoying parallel adventures that happen to overlap. The freedom that draws them together has to eventually make room for real depth, or the relationship stays wonderful and never quite becomes permanent. If both partners lean into commitment without feeling it costs them their independence, this becomes one of the most genuinely fun, alive pairings in the zodiac."},"Aries|Capricorn":{"opening":"Fire meets earth, and the meeting point is impulse versus strategy. Aries Venus loves through speed and instinct \u2014 it wants to move now, decide now, act on the feeling immediately. Capricorn Venus loves through patience and structure \u2014 it wants to build carefully, prove commitment through consistency over time, not through a single bold gesture. These two can either balance each other into something genuinely strong, or wear each other down through sheer difference in pace.","clicks":"Capricorn is quietly impressed by Aries's confidence and willingness to just act, something Capricorn's own caution sometimes prevents. Aries, in turn, respects Capricorn's competence and ambition \u2014 a partner who takes things seriously and follows through rather than just talking about it. When it works, Aries injects some spontaneity into Capricorn's more disciplined life, and Capricorn gives Aries's impulses some actual structure to land in, turning excitement into something that lasts.","strains":"Aries wants immediate momentum; Capricorn wants a plan first, and Aries pushing for speed before Capricorn feels ready can trigger exactly the caution Aries finds frustrating. Capricorn's reserve can also read to Aries as coldness or a lack of enthusiasm, when it's really just a different, slower way of caring. Aries's bluntness, meanwhile, can bruise Capricorn's pride more than Aries realizes \u2014 Capricorn takes competence seriously and doesn't love being second-guessed in the moment, especially publicly.","real_test":"This pairing works if Aries can learn patience for Capricorn's need to plan before it leaps, trusting that Capricorn's caution is devotion in a different form, and if Capricorn can learn to loosen its grip sometimes and let Aries's spontaneity in without treating it as recklessness. Both signs are ambitious and loyal in their own ways; the test is whether that shared drive gets pointed at the same goals rather than at each other's different paces. Get it right, and this is a genuinely powerful, complementary pairing."},"Aries|Aquarius":{"opening":"Two independent spirits who both resist being told what love should look like. Aries Venus loves through directness and pursuit, knowing what it wants and going after it without hesitation. Aquarius Venus loves through friendship and intellectual connection, wanting a partner who respects its individuality above almost everything else. Together these two tend to build a relationship that looks unconventional and feels remarkably unrestrictive \u2014 neither one is trying to box the other in.","clicks":"Aquarius admires Aries's confidence and refusal to overthink things, a nice counterbalance to its own tendency to intellectualize everything. Aries, in turn, appreciates that Aquarius doesn't need constant reassurance or drama \u2014 just genuine respect and real conversation. Both value independence deeply, and neither partner smothers the other; there's a real sense of two whole people choosing each other rather than needing each other to feel complete, which suits both signs just fine.","strains":"Aries wants passion expressed directly and immediately; Aquarius tends to process feeling through the mind first, which can leave Aries feeling like the emotional temperature never quite matches its own intensity. Aquarius's need for independence and space, meanwhile, can occasionally read to Aries as detachment or disinterest, when it's really just Aquarius's baseline way of loving. Aries's impatience can also clash with Aquarius's more theoretical, unhurried approach to big decisions and commitment itself.","real_test":"This pairing works if Aries learns to read Aquarius's quieter, more cerebral affection as real devotion rather than coldness, and if Aquarius learns to occasionally meet Aries's need for direct, embodied passion rather than staying safely in the realm of ideas. Both signs value freedom and honesty; the test is building real emotional intimacy on top of that mutual respect, rather than mistaking respect alone for closeness. Done well, this is a refreshingly unrestrictive, genuinely respectful pairing."},"Aries|Pisces":{"opening":"Fire meets water, and the meeting point is force versus flow. Aries Venus loves through directness and action \u2014 it wants to know where it stands and moves toward what it wants without much hesitation. Pisces Venus loves through empathy and emotional immersion \u2014 soft, intuitive, sometimes needing a while to even name what it feels, let alone act on it. This pairing can be genuinely tender when Aries learns gentleness, or quietly overwhelming when Aries's speed outpaces Pisces's more fragile emotional pace.","clicks":"Pisces is drawn to Aries's confidence and clarity \u2014 someone who knows what they want is deeply reassuring to a sign that often loses itself in ambiguity. Aries, in turn, can be genuinely moved by Pisces's depth of feeling and imagination, a softness that Aries doesn't always access on its own. When it works, Aries becomes Pisces's protector and anchor, and Pisces becomes the emotional depth that gives Aries's boldness real meaning rather than just momentum.","strains":"Aries's bluntness can wound Pisces more than Aries ever intends \u2014 Pisces absorbs feeling deeply, and a careless comment that Aries has already forgotten can linger with Pisces for a long time. Pisces's tendency to avoid direct confrontation, meanwhile, can frustrate Aries, who wants problems named and solved quickly rather than gently avoided or dissolved into hurt feelings that never get voiced clearly. Aries can also unintentionally overpower Pisces's gentler nature, moving too fast for Pisces to keep pace emotionally.","real_test":"This pairing works if Aries consciously slows its words and its pace around Pisces's more tender rhythm, treating gentleness as a skill worth building rather than a weakness. And it works if Pisces learns to voice hurt and needs directly instead of retreating into quiet avoidance, trusting Aries can handle honesty without it damaging the relationship. If Aries becomes Pisces's protector rather than an accidental source of hurt, this pairing has real depth and tenderness available to it. If neither adjusts, Pisces just learns to flinch and retreat further inward."},"Taurus|Taurus":{"opening":"Two people who love the exact same way, at the exact same speed, which is either the most restful relationship in the zodiac or the slowest-moving one. Taurus Venus loves through consistency, physical affection, good food, and comfort \u2014 it wants a partner who isn't going anywhere and isn't asking for anything performative. Two of them together skip the entire negotiation over pacing that plagues most pairings, because neither one is in a hurry for anything.","clicks":"This is one of the most naturally comfortable Venus pairings there is. Both partners value the same things: reliability, sensual pleasure, a well-kept home, financial security, physical touch. Nobody has to explain why they need routine, or defend wanting to stay in instead of going out, or justify taking things slow. There's a shared appreciation for the good things in life \u2014 a nice meal, a comfortable bed, quality over quantity in everything \u2014 that makes daily life together feel indulgent rather than mundane. Trust builds early because neither partner is inclined toward games or sudden shifts.","strains":"The risk with two Taurus Venuses is stagnation, not conflict. Both partners are so comfortable with the status quo that neither one pushes the relationship to grow, try new things, or leave the routine that's become safe. Stubbornness compounds this \u2014 when disagreements do happen, over money, over change, over who's being more inflexible, neither partner backs down easily, and standoffs can last a genuinely long time because giving in doesn't come naturally to this sign. There's also a risk of possessiveness on both sides; Taurus Venus can be quietly jealous, and two of them together can create a relationship that's secure but a little insular.","real_test":"The test isn't whether these two can build a stable life together \u2014 they will, almost automatically. The test is whether they can resist the gravitational pull toward total sameness, toward never being surprised, toward mistaking comfort for the whole relationship. Taurus Venus needs to occasionally be pulled out of its own routine to stay alive to the relationship rather than just familiar with it, and with two Taurus partners, neither one naturally provides that push. If both partners can consciously introduce small moments of novelty \u2014 a new place, a spontaneous decision, an actual difficult conversation instead of comfortable silence \u2014 this becomes one of the most enduring pairings in the zodiac. If neither does, it's stable, warm, and very slowly loses its pulse."},"Taurus|Gemini":{"opening":"Earth meets air, and the meeting point is stability versus stimulation. Taurus Venus loves through consistency, physical presence, and slow-built trust \u2014 it wants a partner who's genuinely there, not just interesting to talk to. Gemini Venus loves through conversation, variety, and mental play \u2014 it wants a partner who keeps things fresh and never bores it with sameness. These two are drawn to what the other has and they themselves lack: Taurus offers Gemini somewhere to actually land, and Gemini offers Taurus a reason to stay curious.","clicks":"Gemini finds Taurus's steadiness genuinely restful after a lifetime of its own restlessness \u2014 someone who isn't going anywhere, who doesn't need to be chased or entertained to stay interested. Taurus finds Gemini's wit and lightness a welcome contrast to its own seriousness, someone who can make an ordinary evening feel unexpectedly fun. Physically this pairing often has real chemistry, Taurus bringing sensuality, Gemini bringing playfulness. When it works, Taurus gives Gemini a reason to slow down sometimes, and Gemini gives Taurus a reason to loosen up.","strains":"The core friction is temperament. Taurus wants predictability and can find Gemini's constant need for novelty exhausting or even a little untrustworthy \u2014 why does today's plan need to change again? Gemini, in turn, can find Taurus's routines stifling, its slowness to embrace anything new frustrating when Gemini is already three ideas ahead. Taurus's possessiveness can also clash with Gemini's need for social freedom; Gemini isn't trying to be evasive, it just genuinely needs more room to roam than Taurus's instinct for closeness is comfortable granting.","real_test":"This pairing works if Taurus can learn that Gemini's need for variety isn't a threat to the relationship's stability, just a different way of staying engaged, and if Gemini can learn that Taurus's need for routine isn't boredom in disguise, just how Taurus builds trust over time. The danger moment is when Taurus starts gripping tighter exactly as Gemini needs more air, each response confirming the other's fear. If both partners can let the other be fundamentally different without treating that difference as a problem to fix, this becomes a relationship with real balance \u2014 grounded enough to last, light enough to never go stale."},"Taurus|Cancer":{"opening":"Two earth-adjacent signs that both understand devotion, just paced differently. Taurus Venus loves through steadiness, sensuality, and reliability \u2014 it wants a partner who isn't going anywhere and doesn't need constant reassurance to know that. Cancer Venus loves through emotional nurturing and closeness \u2014 it wants a partner who checks in, who notices the mood shift, who makes love felt as much as known. Both are homebodies at heart, both take commitment seriously, and both are building toward the same kind of life, just expressing the journey there differently.","clicks":"This pairing has an easy, natural warmth. Taurus's steadiness gives Cancer exactly the security it's always looking for \u2014 the sense that the relationship isn't going anywhere, that today's mood won't threaten tomorrow's commitment. Cancer's emotional attentiveness gives Taurus permission to be soft in a way it doesn't always allow itself, someone who actually asks how Taurus is feeling rather than assuming everything's fine because nothing's been said. Both value home, comfort, and consistency, and together they tend to build a genuinely nurturing domestic life \u2014 good food, physical affection, a home that feels like a retreat from the world.","strains":"Cancer wants emotional expression \u2014 words, reassurance, active engagement with feelings \u2014 and Taurus, while deeply loving, doesn't always reach for language first; it shows love through presence and provision, which Cancer can occasionally read as distance if it isn't also hearing the words. Taurus's stubbornness can also collide with Cancer's moodiness in ways neither handles gracefully \u2014 Taurus wants to solve the mood and move on, Cancer needs to feel the mood through before it's ready to move on, and neither pace suits the other in the moment.","real_test":"This pairing thrives when Taurus learns that saying the feeling out loud, even briefly, means more to Cancer than any amount of steady presence alone, and when Cancer learns to trust Taurus's quieter, action-based devotion as real love rather than waiting for a more verbal version of it. The two paces \u2014 Taurus's patience and Cancer's emotional tides \u2014 actually complement each other well once both partners stop expecting the other to simply match their own rhythm. Get that translation right, and this becomes one of the most quietly enduring pairings in the zodiac: two people building a genuinely safe, sensory, deeply loyal life together."},"Taurus|Leo":{"opening":"Two fixed signs, both loyal, both stubborn, both certain of what they want. Taurus Venus loves through steadiness, sensuality, and consistency \u2014 it wants comfort, physical affection, a partner who isn't going anywhere. Leo Venus loves through warmth, generosity, and grand romantic gestures \u2014 it wants admiration, celebration, a partner who makes it feel like a star. Both signs are deeply loyal once committed, and both are used to getting their way, which makes this pairing either a rich, sensual, mutually devoted partnership or a very slow-motion standoff.","clicks":"Both partners share a love of the finer things \u2014 good food, comfort, beauty, physical pleasure \u2014 and neither one has to apologize for wanting a nice life well-lived. Taurus's steadiness gives Leo a stable stage to shine from, someone who isn't going anywhere no matter how much attention Leo requires elsewhere. Leo's warmth and generosity, in turn, make Taurus feel genuinely adored, showered with the kind of open affection Taurus quietly craves but rarely asks for. Loyalty runs deep on both sides, and once trust is built, it tends to hold.","strains":"Both signs are famously stubborn, and neither backs down easily once a position is taken, which means disagreements between two Taurus-Leo Venuses can turn into genuine standoffs, both partners equally convinced they're right and equally unwilling to be the first to yield. Leo's need for admiration and attention can also outpace Taurus's more reserved, less performative nature \u2014 Taurus shows love through presence, not applause, and Leo craving more visible enthusiasm than Taurus naturally gives can leave Leo feeling under-celebrated even in a genuinely devoted relationship.","real_test":"This pairing works if both partners learn that yielding occasionally isn't losing \u2014 it's how two equally strong-willed people actually build something together instead of just coexisting stubbornly. Taurus has to learn to voice admiration more openly than comes naturally, since Leo needs to hear it, not just sense it. Leo has to learn that Taurus's quieter steadiness is its own form of devotion, not a lesser one. If both partners can meet each other's actual love language instead of only offering their own, this becomes a rich, loyal, deeply sensual pairing with real staying power."},"Taurus|Virgo":{"opening":"Two earth signs who understand each other's pace almost immediately. Taurus Venus loves through steadiness, sensuality, and consistency \u2014 it wants comfort and reliability, someone who isn't going anywhere. Virgo Venus loves through care and quiet competence \u2014 it wants to be useful, to demonstrate love through action and attention rather than declarations. Both are patient, grounded, unhurried signs, which means this pairing tends to build trust slowly and solidly, without much drama along the way.","clicks":"Both partners share a deep appreciation for routine, quality, and doing things properly, which means neither has to defend wanting a slower, more deliberate kind of life. Virgo's attentiveness meets a genuine need in Taurus, who loves being taken care of in small, consistent ways. Taurus's sensuality and warmth, in turn, help Virgo relax out of its own head and into the body, into pleasure, into simply enjoying something without immediately analyzing it. Trust builds naturally here, since neither partner is inclined toward games or sudden shifts in behavior.","strains":"Taurus can be slow to change and quietly stubborn about it, which can frustrate Virgo's instinct to improve, refine, and optimize \u2014 Virgo sees room for adjustment, Taurus sees no reason to fix what isn't broken, and neither position moves easily. Virgo's tendency to notice flaws, meanwhile, can wear on Taurus's comfort-seeking nature; Taurus wants to relax into what's good, and constant, well-meaning critique can make that harder than it should be. Both partners can also struggle with expressing feelings directly, leading to quiet tension that neither addresses until it's built up.","real_test":"This pairing thrives when Virgo learns to offer feedback more gently and less frequently, trusting that Taurus doesn't need everything optimized to be loved well, and when Taurus stays a little more open to Virgo's suggestions instead of digging in purely out of habit. Both partners are naturally devoted and naturally patient; the test is simply making sure that patience doesn't calcify into two people quietly annoyed with each other's fundamental nature. Get that right, and this is one of the steadiest, most quietly reliable pairings in the zodiac."},"Taurus|Libra":{"opening":"Both signs ruled by Venus itself, which means both share a deep, native love of beauty, comfort, and pleasure \u2014 they just chase it differently. Taurus Venus wants beauty you can touch: good food, physical comfort, a well-made home. Libra Venus wants beauty you can share: elegant company, gracious partnership, harmony maintained between two people. This pairing tends to have real aesthetic and romantic chemistry from the start, since both partners speak a similar language of pleasure, just with different accents.","clicks":"Both partners appreciate the finer things and neither has to justify wanting a beautiful, comfortable life together \u2014 good meals, a tastefully kept home, romance that's unhurried and sensory. Libra's charm and social ease bring Taurus into a wider, more graceful social world than it might build alone, while Taurus's steadiness gives Libra something solid to actually build the partnership on, rather than just the idea of one. There's real warmth and real romance here, unhurried and genuinely appreciative of each other.","strains":"Taurus wants things settled and predictable; Libra wants things balanced and fair, and sometimes fairness requires more negotiation and back-and-forth than Taurus has patience for. Taurus's stubbornness can frustrate Libra's need for compromise \u2014 Libra wants to find the middle ground, Taurus sometimes just wants its own preference honored without further discussion. Libra's indecision, meanwhile, can wear on Taurus, who prefers a clear answer over endless weighing of options; watching Libra deliberate over something Taurus considers simple can test its patience.","real_test":"This pairing works if Taurus learns to engage with Libra's need for genuine back-and-forth rather than treating its own preference as the obvious right answer, and if Libra learns to make a decision sometimes without needing full consensus first, trusting that Taurus won't take a clear choice personally. Both partners deeply value comfort and harmony; the test is building a shared version of both rather than each expecting the other to simply prefer what they already prefer. Get that right, and this is a genuinely elegant, comfortable, mutually appreciative pairing."},"Taurus|Scorpio":{"opening":"Two fixed signs, opposite on the wheel, both intensely loyal and both deeply possessive once committed. Taurus Venus loves through steadiness, sensuality, and physical presence \u2014 slow to trust, but rock solid once it does. Scorpio Venus loves through depth and total emotional merging \u2014 also slow to trust, but consuming and absolute once it commits. This pairing tends to have serious gravitational pull: profound loyalty, real physical chemistry, and an intensity that neither partner finds too much, because they match each other exactly.","clicks":"Both partners understand commitment as something sacred, not casual, and neither has to convince the other that slow, deliberate trust-building is worth it. There's real depth here \u2014 Scorpio's emotional intensity meets Taurus's physical devotion, and together they build a bond that's hard to shake once established. Both signs are fiercely loyal and genuinely protective of what they've built, and outside interference rarely threatens this pairing, since neither partner is looking elsewhere once truly committed.","strains":"Both signs are famously stubborn, and both can be possessive to the point of real jealousy \u2014 Taurus wants its partner close and predictable, Scorpio wants total emotional access, and together those instincts can tip from devoted into controlling if neither checks it. Disagreements between two fixed signs can also turn into genuine standoffs, since neither backs down easily once a position is taken. Scorpio's need for emotional intensity can also outpace Taurus's more even, steady temperament, leaving Scorpio wanting more depth than Taurus is offering in the moment.","real_test":"This pairing works if both partners actively guard against possessiveness curdling into control, choosing trust over surveillance even when old instincts say otherwise. Taurus has to make room for Scorpio's need for real emotional depth, not just physical steadiness; Scorpio has to respect Taurus's need for a calmer, less intense pace some of the time. If both partners manage that, this is one of the most profoundly loyal, enduring pairings in the zodiac \u2014 slow to build, nearly impossible to break once it is."},"Taurus|Sagittarius":{"opening":"Earth meets fire, and the meeting point is roots versus roaming. Taurus Venus loves through steadiness and consistency \u2014 it wants a partner who's genuinely there, building a life in one place. Sagittarius Venus loves through freedom and exploration \u2014 it wants a partner who won't ask it to stay still for too long. These two are drawn to what they lack in themselves: Taurus offers Sagittarius somewhere to actually land, Sagittarius offers Taurus a reason to see more of the world than it might on its own.","clicks":"Sagittarius finds real comfort in Taurus's steadiness \u2014 a partner who isn't going anywhere means Sagittarius can roam and always have somewhere solid to return to. Taurus, in turn, finds Sagittarius's optimism and adventurousness genuinely refreshing, a nudge out of routines that might otherwise calcify into ruts. There's real warmth here when both partners let the other's difference actually enrich their own life rather than threaten it.","strains":"Taurus wants predictability; Sagittarius needs room to roam, and Taurus's instinct to hold on tighter exactly when Sagittarius needs more space can trigger the very distance Taurus fears. Sagittarius's bluntness, meanwhile, can wound Taurus's more sensitive, security-seeking nature \u2014 Sagittarius says the true thing without much cushioning, and Taurus can take that harder than Sagittarius expects. Sagittarius may also find Taurus's resistance to change frustrating when Sagittarius is already three ideas and one plane ticket ahead.","real_test":"This pairing works if Taurus learns that Sagittarius's need for freedom isn't a threat to the relationship's stability, and if Sagittarius learns to actually commit to building roots somewhere, even while keeping room to roam. The danger moment is Taurus gripping tighter just as Sagittarius pulls for air, confirming each other's worst fear. If both can let the other be fundamentally different without treating it as a problem, this becomes a relationship with real breadth \u2014 grounded enough to last, adventurous enough to never go stale."},"Taurus|Capricorn":{"opening":"Two earth signs who understand each other's patience almost immediately. Taurus Venus loves through steadiness, sensuality, and consistency \u2014 slow, deliberate, deeply loyal once committed. Capricorn Venus loves through commitment and long-term building \u2014 also slow, also deliberate, proving devotion through follow-through rather than declarations. This pairing tends to build trust with real solidity, two people who both understand that the best things take time and neither one is in a rush to skip that process.","clicks":"Both partners share a deep respect for stability, hard work, and doing things properly, which means neither has to defend wanting a slower, more deliberate kind of life together. Capricorn's ambition and discipline give Taurus something solid to admire and rely on; Taurus's sensuality and warmth, in turn, help Capricorn relax into pleasure and comfort rather than staying purely focused on achievement. Trust builds slowly here but holds firmly once established, and both partners tend to genuinely enjoy building a life, not just a relationship, together.","strains":"Both signs can be quietly stubborn, and both can prioritize practicality over emotional expression, which means this pairing risks becoming so focused on stability and structure that romance and spontaneity fall by the wayside. Neither partner naturally initiates play or lightness, and without one person pushing against pure practicality, the relationship can start to feel more like a well-run partnership than a passionate one. Both can also internalize stress rather than voice it, creating quiet distance neither addresses until it's grown.","real_test":"This pairing thrives when both partners deliberately build in room for softness, spontaneity, and actual romance, treating it as seriously as any other shared goal since neither will stumble into it by accident. Both are fully capable of deep devotion and even deeper tenderness \u2014 it just needs active permission to show up rather than staying buried under practicality. If both partners make that effort, this becomes one of the most stable, enduring pairings in the zodiac. If neither does, it holds together perfectly and never quite feels alive."},"Taurus|Aquarius":{"opening":"Two fixed signs that want almost opposite things from love. Taurus Venus loves through physical presence, routine, and sensory comfort \u2014 it wants a partner who's tangibly there, consistent, predictable in the best way. Aquarius Venus loves through independence and intellectual connection \u2014 it resists routine on principle and needs space to feel free even inside commitment. This pairing can be genuinely stimulating for both, or a slow, quiet standoff between someone who wants to hold on and someone who needs room to breathe.","clicks":"Aquarius finds real comfort in Taurus's steadiness, a rare stability that doesn't ask Aquarius to explain or defend its need for independence \u2014 Taurus just is reliably there. Taurus, in turn, is drawn to Aquarius's originality and the way it makes ordinary life feel less predictable, a genuine intellectual spark Taurus doesn't always get elsewhere. When it works, Taurus grounds Aquarius's more abstract nature, and Aquarius pulls Taurus out of ruts it didn't know it had settled into.","strains":"Taurus wants physical closeness and consistency; Aquarius needs mental space and independence, and Taurus's instinct to hold on tighter when it senses distance is exactly the wrong move with a partner who needs room to feel loved. Aquarius's tendency to intellectualize feelings, meanwhile, can leave Taurus feeling like the emotional and physical connection it craves is somehow always slightly out of reach. Both signs are also famously stubborn, just about different things, which can turn small disagreements into long, quiet standoffs.","real_test":"This pairing works if Taurus learns that Aquarius's need for space isn't rejection, just how Aquarius stays itself inside a relationship, and if Aquarius learns to offer the physical presence and reassurance Taurus genuinely needs, even when it doesn't come naturally. The danger moment is Taurus gripping tighter exactly when Aquarius needs air, confirming both of their worst fears at once. If both partners let the other be fundamentally different without treating it as a flaw, this becomes an unusually stimulating, quietly stable pairing."},"Taurus|Pisces":{"opening":"Earth meets water, and the combination tends to be genuinely tender. Taurus Venus loves through steadiness, sensuality, and physical presence \u2014 grounded, patient, deeply loyal. Pisces Venus loves through empathy and emotional immersion \u2014 soft, intuitive, wanting to merge completely with a partner it trusts. Taurus gives Pisces something to hold onto; Pisces gives Taurus access to a depth of feeling it doesn't always reach on its own. This pairing tends to feel like a genuine sanctuary for both.","clicks":"Pisces finds real safety in Taurus's steadiness \u2014 a partner who isn't going anywhere lets Pisces's more dreamy, sometimes ungrounded nature finally rest. Taurus, in turn, is moved by Pisces's tenderness and imagination, a softness that draws out a side of Taurus it doesn't show most people. Both signs value comfort, beauty, and emotional and physical closeness, and together they tend to build a home life that feels genuinely nurturing \u2014 unhurried, sensory, quietly romantic.","strains":"Taurus can be stubborn and practical in ways that feel harsh against Pisces's more delicate, easily-hurt nature \u2014 a blunt Taurus opinion, meant simply as honesty, can land on Pisces harder than intended. Pisces's tendency to avoid hard conversations or escape into fantasy, meanwhile, can frustrate Taurus's need for straightforward reliability; Taurus wants to know where it stands, and Pisces's vagueness about feelings or plans can leave Taurus feeling ungrounded in a relationship that's supposed to be its anchor.","real_test":"This pairing works if Taurus softens its directness around Pisces's more porous emotional nature, and if Pisces pushes itself to be clearer and more grounded about needs and plans rather than letting things stay comfortably vague. Taurus offers Pisces real stability; Pisces offers Taurus real emotional depth. If both partners lean into what the other actually offers instead of getting frustrated by the difference, this becomes one of the most tender, quietly devoted pairings in the zodiac."},"Gemini|Gemini":{"opening":"Two people who love the exact same way: through words, wit, and constant motion. Gemini Venus doesn't sit still in love \u2014 it wants to talk, tease, text back and forth all day, discover a hundred small things about a person before it commits to loving the whole of them. Two of them together skip the entire awkward negotiation over how much conversation is enough, because neither one has a ceiling on it. This is a pairing built on chemistry of the mind first, everything else second.","clicks":"Nobody has to slow down for the other, and nobody has to explain why they need variety, new plans, new topics, new places. Both partners are naturally curious about each other and about everything else, which keeps the relationship feeling more like an ongoing conversation than a settled routine. There's an ease to the flirtation here \u2014 quick banter, shared references, the sense of being endlessly entertained by someone who is just as quick as you are. Jealousy tends to be low, since both understand the other's need for social variety isn't a threat, just a personality trait they happen to share.","strains":"Two Gemini Venuses can talk about everything and still avoid the one conversation that actually matters. Depth doesn't come naturally to either partner \u2014 when things get emotionally heavy, both may reach for a joke, a subject change, or simply disappear into being busy elsewhere, and neither one is there to anchor the other back down. Follow-through is another risk: plans get made enthusiastically and forgotten just as fast, and neither partner is naturally the one who remembers, confirms, or shows up with the details handled. Two restless minds can also mean two people quietly wondering, during any lull, whether they're missing something more interesting happening elsewhere.","real_test":"This pairing works if both partners can consciously choose to occasionally sit still together, not because it comes naturally, but because they've decided the relationship is worth the discomfort of slowing down. Gemini Venus can love someone for years while still feeling like the relationship never quite deepened past year one, and with two Geminis, there's no external pull toward depth unless they build it on purpose \u2014 actual repeated rituals, real vulnerability, choosing the same person on a day when a newer conversation elsewhere would be easier. If they can do that without losing the lightness that drew them together in the first place, this becomes a relationship that's endlessly fun and surprisingly enduring. If they can't, it stays delightful and never quite becomes home."},"Gemini|Cancer":{"opening":"One loves by feeling, the other loves by talking. Cancer Venus shows affection through emotional depth, memory, and closeness \u2014 it wants to hold hands with someone's inner world, to be trusted with the soft parts, to build a private universe of in-jokes and rituals over time. Gemini Venus shows affection through curiosity, banter, and movement \u2014 it wants a partner who's endlessly interesting to talk to, who doesn't need every feeling spelled out, who can ride the current of a conversation wherever it goes. These two are speaking different love dialects from day one, and whether that becomes charming or exhausting depends entirely on how much either one is willing to learn the other's language.","clicks":"Gemini brings lightness Cancer doesn't always give itself permission to have \u2014 a way of turning a heavy day into a joke, of keeping things playful when Cancer would otherwise sink into its own feelings. Cancer brings a kind of emotional attentiveness Gemini rarely receives \u2014 someone who actually remembers what was said three weeks ago, who notices the mood shift before it's spoken. There's real charm here: Gemini's wit paired with Cancer's warmth can make for a relationship that's both fun and tender, chatty dinners that turn into real conversations, a partner who makes Cancer laugh and a partner who makes Gemini feel actually known rather than just entertaining.","strains":"Cancer needs consistency and emotional check-ins; Gemini needs variety and mental freedom, and can feel boxed in by too much processing or too many questions about \"where this is going.\" When Cancer reaches for reassurance, Gemini's instinct to lighten the mood or change the subject can land as dismissive, even when it's not meant that way. Meanwhile Gemini's natural sociability and need for space can trigger Cancer's deeper fear of being unimportant or easily replaced \u2014 Cancer notices distance and reads it as withdrawal of love, when for Gemini it's often just normal breathing room. Neither one is wrong about what they need; the problem is each one's normal is the other's warning sign.","real_test":"This pairing works if Gemini learns that Cancer's need for reassurance isn't clinginess, it's Cancer's actual love language, and a few consistent words of care go further here than any clever joke. And it works if Cancer learns that Gemini's need for lightness and space isn't evidence of lesser feeling, just a different rhythm of closeness \u2014 Gemini can be deeply loyal while still needing room to roam mentally and socially. The danger moment is a stretch where Cancer spirals into needing more closeness right as Gemini pulls back for air, each move confirming the other's worst fear. If both partners can catch that pattern and name it instead of react to it, this becomes a relationship with real range \u2014 deep enough to matter, light enough to never go stale."},"Gemini|Leo":{"opening":"One loves through words, the other through warmth and spectacle. Gemini Venus shows affection through conversation, wit, and mental play \u2014 it wants a partner who's endlessly interesting to talk to. Leo Venus shows affection through generosity and grand gestures \u2014 it wants a partner who admires it openly and lets itself be admired in return. Both signs bring real energy and enthusiasm to a relationship, and together they tend to create something genuinely fun, full of banter, celebration, and social vibrance.","clicks":"Leo is drawn to Gemini's quick wit and endless curiosity \u2014 never a dull conversation, always a new angle to explore. Gemini, in turn, enjoys Leo's confidence and warmth, the way Leo makes ordinary moments feel a little more special just by being enthusiastic about them. Both signs love being social, and together they tend to be a couple people genuinely enjoy being around \u2014 lively, warm, quick to laugh. Neither one demands the other tone down their personality to keep the peace.","strains":"Leo wants consistent, focused admiration; Gemini's attention naturally scatters across many things, many people, many interests, and Leo can read that scattering as a lack of investment even when it isn't personal. Gemini, in turn, can find Leo's need for constant affirmation a little exhausting to maintain \u2014 Gemini's affection ebbs and flows with its mood and its mental energy, while Leo wants something steadier and more visibly demonstrative. Leo's pride can also clash with Gemini's tendency toward playful teasing, which Leo doesn't always take as lightly as Gemini intends it.","real_test":"This pairing works if Gemini learns to direct its attention more consistently toward Leo, making sure Leo feels like the priority even amid Gemini's naturally wide-ranging interests, and if Leo learns to take Gemini's teasing and mental restlessness less personally, trusting it as personality rather than disinterest. Both signs bring real charisma to a relationship; the test is making sure that charisma is aimed at each other as much as it's aimed at the world. Done well, this is a genuinely vibrant, fun, socially alive pairing."},"Gemini|Virgo":{"opening":"Both signs ruled by Mercury, which means both process the world through the mind first \u2014 they just use that mind differently. Gemini Venus loves through conversation, curiosity, and constant mental movement, wanting a partner who keeps things interesting. Virgo Venus loves through care and precision, wanting a partner who appreciates thoughtfulness and doesn't need everything performed loudly. This pairing tends to have real intellectual chemistry, two quick minds who understand each other's way of thinking even when their personalities express it differently.","clicks":"Both partners genuinely enjoy conversation, analysis, and figuring things out together, which means neither has to dumb things down or slow down to keep up with the other. Virgo's attentiveness and reliability give Gemini something to actually rely on beneath all the mental motion, while Gemini's lightness and humor help Virgo loosen up and not take every detail quite so seriously. There's real mutual respect for intelligence here, and a shared appreciation for getting things right rather than settling for approximate.","strains":"Gemini's need for variety and spontaneity can clash with Virgo's need for order and routine \u2014 Virgo wants a plan, Gemini wants to see what happens, and neither instinct yields easily to the other. Virgo's tendency toward critique, meanwhile, can needle at Gemini more than Virgo intends; Gemini doesn't love being corrected mid-thought, and Virgo's precision can come across as nitpicking rather than the care it's meant to convey. Emotional depth is the shared blind spot \u2014 both signs can intellectualize a feeling rather than actually sit inside it, leaving real vulnerability harder to reach than either expects.","real_test":"This pairing works if Virgo learns to offer its observations more gently, trusting that Gemini doesn't need every idea refined immediately, and if Gemini learns to actually follow through on plans and commitments Virgo cares about, rather than letting its own restlessness override them. Both partners are sharp enough to talk their way through almost anything; the test is making sure that talk eventually becomes real emotional closeness rather than just clever conversation. Get that right, and this is a genuinely stimulating, well-matched pairing."},"Gemini|Libra":{"opening":"Two air signs who understand each other's need for mental stimulation and social ease almost immediately. Gemini Venus loves through conversation, curiosity, and constant variety. Libra Venus loves through harmony, partnership, and grace. Both signs live comfortably in the world of ideas and relationships, and together they tend to build something light, charming, and genuinely easy \u2014 real chemistry with very little friction in the early stages.","clicks":"Both partners are naturally social, articulate, and quick to find common ground, which means conversation between them rarely runs dry and social settings feel effortless rather than draining. Libra's diplomacy smooths any rough edges Gemini's bluntness might create, while Gemini's wit keeps Libra's more considered, careful nature entertained rather than bored. Both value fairness and consideration, and neither one steamrolls the other, which makes for a genuinely pleasant, low-conflict partnership in most everyday moments.","strains":"Both signs can struggle with decisiveness and follow-through in their own ways \u2014 Gemini because its attention scatters, Libra because it wants full consensus before committing \u2014 and a relationship where neither partner anchors plans firmly can drift pleasantly without ever quite solidifying. Emotional depth is the shared blind spot too; both can stay comfortably in the realm of ideas and pleasantries rather than risk the vulnerability real intimacy requires, which can leave the relationship feeling light in a way that eventually craves more weight.","real_test":"This pairing works if both partners consciously choose to go deeper than easy conversation and mutual charm, treating real emotional vulnerability as worth the discomfort it requires. Both are gifted at keeping things pleasant; the test is whether they're equally willing to sit in something less pleasant together when it matters. If they build that muscle, this becomes a genuinely delightful, intellectually alive partnership. If not, it stays lovely and never quite becomes profound."},"Gemini|Scorpio":{"opening":"Air meets water, and the meeting point is surface versus depth. Gemini Venus loves through conversation, variety, and lightness \u2014 curious about everything, attached intensely to little. Scorpio Venus loves through total emotional immersion \u2014 slow to trust, but consuming and absolute once committed. These two can genuinely fascinate each other, or talk past each other entirely, depending on whether Gemini can go deeper than its instinct prefers and Scorpio can loosen its grip enough to let Gemini breathe.","clicks":"Scorpio is intrigued by Gemini's quick mind and effortless social ease, qualities Scorpio's own intensity doesn't naturally produce. Gemini, in turn, finds Scorpio's depth genuinely magnetic \u2014 a mystery worth exploring, someone who feels like there's always more beneath the surface to discover. When it works, Scorpio draws Gemini into real emotional territory it migh
