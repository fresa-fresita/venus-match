wo can genuinely fascinate each other \u2014 Scorpio drawn to Sagittarius's openness, Sagittarius drawn to Scorpio's intensity \u2014 though the relationship only works if Scorpio can loosen its grip and Sagittarius can offer more emotional depth than comes naturally.","clicks":"Sagittarius is drawn to Scorpio's intensity and depth, a seriousness about connection that feels different from more casual romantic experiences. Scorpio, in turn, is intrigued by Sagittarius's honesty and lack of pretense \u2014 what you see is what you get, and Scorpio respects that directness even as it wants to dig deeper. When it works, Sagittarius helps Scorpio loosen its guardedness and see life a bit more lightly, while Scorpio gives Sagittarius's adventures real emotional meaning.","strains":"Scorpio wants total commitment and exclusive focus; Sagittarius needs independence and can find Scorpio's intensity and jealousy genuinely stifling, a cage rather than closeness. Sagittarius's bluntness and need for freedom, meanwhile, can trigger Scorpio's deep-seated fear of betrayal or abandonment, especially since Scorpio reads emotional distance as a threat rather than simply Sagittarius's normal way of being. Trust is hard-won here, and Sagittarius's natural restlessness can make Scorpio feel perpetually on edge.","real_test":"This pairing works if Scorpio learns to trust Sagittarius's need for freedom isn't a betrayal, loosening its grip rather than tightening it when it feels uncertain, and if Sagittarius learns to offer Scorpio more consistent reassurance and emotional depth than comes naturally. Done right, this is a genuinely passionate, transformative pairing \u2014 Scorpio's depth meeting Sagittarius's expansiveness. Done wrong, it's a cycle of pursuit and retreat that exhausts them both."},"Scorpio|Capricorn":{"opening":"Two signs that understand power, patience, and total commitment. Scorpio Venus loves through emotional depth and intensity. Capricorn Venus loves through discipline and long-term devotion. Both signs are guarded, both take love seriously, and neither one does casual \u2014 this pairing tends to build slowly, deliberately, and with real staying power once trust is established between two people equally unwilling to waste time on anything less than genuine.","clicks":"Both partners respect strength, competence, and seriousness of purpose, which means neither has to convince the other that love should be taken this seriously. Scorpio's intensity gives Capricorn access to real emotional depth beneath its disciplined exterior; Capricorn's steadiness, in turn, gives Scorpio something solid and reliable to actually trust, rare for a sign so wary of being let down. Loyalty runs deep on both sides, and this pairing tends to build a genuinely powerful, enduring partnership.","strains":"Both signs can be controlling in their own ways \u2014 Scorpio through emotional intensity, Capricorn through practical structure \u2014 and two people both wanting to direct the relationship's terms can create quiet power struggles neither openly names. Capricorn's reserve can also frustrate Scorpio's need for total emotional transparency; Scorpio wants to know everything, and Capricorn's more private, compartmentalized nature can trigger Scorpio's suspicion even when nothing is actually being hidden.","real_test":"This pairing works if Capricorn learns to offer Scorpio more emotional transparency than its natural reserve prefers, and if Scorpio learns to trust Capricorn's quieter devotion without demanding constant proof. Both partners are ambitious, loyal, and capable of real depth; the test is directing that shared intensity toward building together rather than each trying to control the terms. Done right, this is one of the most powerful, enduring pairings in the zodiac."},"Scorpio|Aquarius":{"opening":"Two fixed signs with almost opposite approaches to intimacy. Scorpio Venus wants total emotional merging, deep exclusive focus on one person. Aquarius Venus wants independence and intellectual connection, wary of anything that feels emotionally consuming. This pairing can be magnetic precisely because of how different they are, though it requires real effort \u2014 Scorpio has to loosen its grip, Aquarius has to lean into feeling more than comes naturally.","clicks":"Aquarius is intrigued by Scorpio's depth and intensity, a seriousness that contrasts with its own more detached, cerebral approach to love. Scorpio, in turn, is fascinated by Aquarius's originality and independence, a kind of freedom Scorpio doesn't often encounter in a partner. When it works, Aquarius helps Scorpio see that love doesn't require total control to be real, and Scorpio helps Aquarius access an emotional depth it usually keeps at arm's length.","strains":"Scorpio wants exclusive emotional focus; Aquarius resists anything that feels possessive or confining, and Scorpio's need for closeness can trigger exactly the withdrawal it fears most. Aquarius's emotional detachment, meanwhile, can read to Scorpio as coldness or even deception \u2014 Scorpio wants to know everything, and Aquarius's more private, independent nature can trigger real suspicion. Both signs are also stubborn in their own ways, and neither backs down easily once a position is taken.","real_test":"This pairing works if Scorpio learns to trust Aquarius's need for independence isn't a threat to its devotion, and if Aquarius learns to offer Scorpio more direct emotional presence than comes naturally, proving its investment isn't just intellectual. Both signs are capable of real loyalty, just expressed in almost opposite registers. If both partners can translate across that gap, this becomes an unusually compelling, transformative pairing."},"Scorpio|Pisces":{"opening":"Two water signs who understand emotional depth as their native language. Scorpio Venus loves through total merging and intensity. Pisces Venus loves through empathy and complete emotional immersion. Together these two build one of the most intuitively deep pairings in the zodiac \u2014 neither partner has to explain the depth of what they feel, because both already live there, fully, without reservation.","clicks":"Both partners offer each other total emotional understanding, a rare sense of being truly known without needing to perform or explain. Scorpio's intensity gives Pisces a partner who can match its depth of feeling; Pisces's tenderness and imagination, in turn, give Scorpio's guardedness somewhere genuinely safe to soften. Trust builds with real gravity here, and once established, this pairing tends to feel like its own private world, protected and profoundly connected.","strains":"Both signs can lose themselves in each other's emotional tides, spiraling together rather than offering the other an anchor when things get intense. Scorpio's need for control can also overwhelm Pisces's more porous, easily-influenced nature \u2014 Pisces wants to merge, but Scorpio's intensity can tip from closeness into something more consuming than Pisces bargained for. Practical matters are the shared blind spot too, since neither partner is naturally drawn to the unglamorous logistics real life requires.","real_test":"This pairing needs at least one partner willing to stay grounded and handle practical reality, rather than both dissolving fully into feeling. Scorpio has to soften its need for control enough to let Pisces's gentleness exist without being overwhelmed by it; Pisces has to build enough of its own boundaries to avoid disappearing entirely into Scorpio's intensity. Done right, this is an extraordinarily deep, almost mystical pairing. Done wrong, it becomes two people submerged with no one steering."},"Sagittarius|Sagittarius":{"opening":"Two people who love through freedom, honesty, and forward motion. Sagittarius Venus doesn't want to be tied down so much as it wants a companion for the journey \u2014 someone who can pack a bag on short notice, who values truth over comfort, who won't mistake independence for a lack of love. Two of them together create a relationship that rarely feels like a cage, full of shared adventures, blunt honesty, and genuine enthusiasm for growth, though it can also be a relationship where neither partner ever quite slows down long enough to build real roots.","clicks":"Neither one has to convince the other that freedom and love can coexist, because both already live that way. Conversations range wide and go deep into philosophy, travel, big ideas about how life should be lived, and neither partner gets bored by the other's restlessness because they share the same appetite for more. There's an easy trust here too \u2014 Sagittarius Venus values honesty above almost everything, and two of them together tend to say exactly what they mean, which cuts through the guesswork many couples struggle with. It feels less like a relationship with rules and more like a shared expedition.","strains":"Two Sagittarius Venuses can be so committed to independence that neither one ever quite commits to building something lasting together. Both partners may keep one foot out the door, not from lack of feeling but from habit, and a relationship where neither person leans all the way in can drift indefinitely without ever solidifying. Bluntness is the other risk \u2014 Sagittarius says the true thing without always cushioning it, and two people doing that to each other can create wounds neither intended, especially since neither one is naturally inclined to sit with a hurt feeling and process it slowly.","real_test":"This pairing works if both partners can choose depth without treating it as a cage \u2014 recognizing that real commitment doesn't have to mean losing the freedom that drew them together in the first place. The test is whether either one is willing to actually stay still long enough to build something, not because they're forced to, but because they've decided this particular journey is worth taking together rather than separately. If they can find that balance, this becomes a rare kind of partnership: two genuinely free people who choose each other daily, adventure included. If neither commits to staying, it remains wonderful and never quite becomes permanent."},"Sagittarius|Capricorn":{"opening":"Fire meets earth, and the meeting point is spontaneity versus structure. Sagittarius Venus loves through freedom and honesty, resisting anything that feels like a cage. Capricorn Venus loves through discipline and long-term commitment, wanting proof of devotion through consistency. These two often intrigue each other precisely because of the contrast \u2014 Sagittarius brings lightness Capricorn doesn't always allow itself, Capricorn brings staying power Sagittarius's restlessness doesn't naturally build alone.","clicks":"Capricorn is quietly drawn to Sagittarius's optimism and adventurousness, a relief from its own more guarded, effortful nature. Sagittarius, in turn, respects Capricorn's ambition and reliability, a partner who actually follows through rather than just talking about big plans. When it works, Sagittarius helps Capricorn loosen up and take a few more risks, while Capricorn gives Sagittarius's expansive energy some real direction and staying power.","strains":"Capricorn wants a plan and predictability; Sagittarius needs room to change course, and Capricorn's need for structure can feel, to Sagittarius, like being slowly reined in. Sagittarius's bluntness, meanwhile, can wound Capricorn's pride \u2014 Capricorn takes competence and reputation seriously, and Sagittarius's blunt honesty can land harder than intended. Capricorn's reserve can also read to Sagittarius as coldness or excessive caution, when it's really just a slower, more careful way of caring.","real_test":"This pairing works if Capricorn learns to loosen its grip on structure enough to let Sagittarius's spontaneity actually enrich the relationship, and if Sagittarius learns to offer Capricorn more consistency and follow-through than comes naturally, proving commitment through action rather than just enthusiasm. If both partners meet the other's real need, this becomes a surprisingly effective, complementary pairing built on real mutual respect."},"Sagittarius|Aquarius":{"opening":"Two signs that both prize freedom and honesty above almost everything else. Sagittarius Venus loves through adventure and directness. Aquarius Venus loves through independence and intellectual connection. Together these two build a relationship that rarely feels confining \u2014 both understand instinctively that love doesn't require possessiveness to be real, and neither one asks the other to shrink to fit a conventional mold.","clicks":"Both partners share a genuine love of ideas, exploration, and doing things differently than everyone else, which means conversation between them tends to range wide and go deep into philosophy, causes, and future possibilities. Neither one is jealous or controlling, and both grant the other real independence without anxiety. There's an easy trust here built on shared values rather than constant reassurance, and both partners tend to feel more like themselves, not less, inside the relationship.","strains":"Both signs can struggle with consistency and follow-through on the relationship's more grounded needs, since neither is naturally drawn to routine or repetitive reassurance. Emotional intimacy can also stay surprisingly surface-level here \u2014 both partners are comfortable with ideas and adventure but less practiced at real vulnerability, and two people both avoiding that depth can leave the relationship feeling more like a great friendship than a deeply intimate partnership.","real_test":"This pairing works if both partners consciously choose to build real emotional depth on top of their shared love of freedom and ideas, rather than assuming intellectual connection is enough on its own. Both are capable of real devotion; the test is whether that devotion gets expressed through actual vulnerability, not just aligned values and mutual respect. Done well, this is a genuinely liberated, stimulating, low-drama pairing with real intellectual and adventurous chemistry."},"Sagittarius|Pisces":{"opening":"Two mutable signs whose approaches to freedom look almost opposite on the surface. Sagittarius Venus loves through honesty, adventure, and independence, seeking truth and open horizons. Pisces Venus loves through empathy and emotional immersion, seeking connection through feeling rather than exploration. Both signs resist rigid structure in their own way \u2014 Sagittarius by roaming outward, Pisces by dissolving inward \u2014 which gives this pairing a dreamy, romantic, occasionally ungrounded quality.","clicks":"Pisces is drawn to Sagittarius's optimism and honesty, a directness that feels refreshing against its own more elusive emotional style. Sagittarius, in turn, is moved by Pisces's imagination and depth of feeling, a softness that adds real meaning to its taste for adventure. When it works, Sagittarius helps Pisces see the wider world with more courage, and Pisces helps Sagittarius feel its way into a deeper, more emotionally connected version of freedom.","strains":"Sagittarius's bluntness can wound Pisces more than intended \u2014 Pisces absorbs feeling deeply, and a careless truth Sagittarius has already moved past can linger with Pisces much longer. Pisces's tendency toward avoidance and emotional ambiguity, meanwhile, can frustrate Sagittarius's need for straightforward honesty; Sagittarius wants a clear answer, Pisces needs time to feel its way toward one, and that mismatch in pace can leave both partners talking past each other.","real_test":"This pairing works if Sagittarius softens its bluntness around Pisces's more tender emotional register, and if Pisces pushes itself toward more direct communication rather than letting feelings stay comfortably vague. Both signs share a real resistance to convention and a taste for the transcendent; the test is building enough practical groundedness that the relationship doesn't just stay a beautiful, occasionally directionless dream. Done well, this is a genuinely romantic, expansive, soulful pairing."},"Capricorn|Capricorn":{"opening":"Two people who love through commitment, competence, and the long game. Capricorn Venus doesn't perform romance so much as it builds it \u2014 brick by brick, through reliability, shared goals, and showing up consistently over time rather than grand gestures in the moment. Two of them together create a relationship with serious staying power: shared ambition, mutual respect for hard work, and a bond that deepens through what they build together rather than what they say to each other. The risk is a partnership so focused on structure that neither partner remembers to just enjoy being in it.","clicks":"Both partners understand, instinctively, that love expressed through effort and follow-through is real love \u2014 nobody has to convince the other that paying the bills on time or showing up prepared is romantic, because they already agree it is. There's deep mutual respect here, especially around ambition and work ethic; two Capricorn Venuses tend to genuinely admire what the other is building, professionally and personally, and support it rather than compete with it. Trust builds slowly but solidly, and once it's established, it rarely wavers \u2014 this is a partnership built to last decades, not months.","strains":"Two Capricorn Venuses can get so absorbed in responsibility that romance quietly falls to the bottom of the list. Neither partner naturally initiates play, spontaneity, or lightness, and without one person pushing against the pull toward pure practicality, the relationship can start to feel more like a well-run partnership than a passionate one. Emotional expression is the other gap \u2014 both partners tend to internalize stress and disappointment rather than voice it, which can create quiet distance neither one addresses until it's grown larger than it needed to.","real_test":"This pairing thrives when both partners deliberately carve out room for softness and play, treating it as seriously as they treat any other goal, since neither will stumble into it by accident. Capricorn Venus is fully capable of deep tenderness, it just needs permission and structure to show up \u2014 a standing date night, an actual conversation about feelings rather than logistics, small rituals that aren't about productivity at all. If both partners build that in deliberately, this becomes one of the most stable, quietly devoted pairings in the zodiac. If neither does, it holds together perfectly and never quite feels alive."},"Capricorn|Aquarius":{"opening":"Two signs that build love through structure, just aimed in different directions. Capricorn Venus loves through discipline, commitment, and proven follow-through, valuing tradition and long-term stability. Aquarius Venus loves through independence and original thinking, often actively resisting convention and tradition on principle. These two can either balance each other into something genuinely innovative and stable, or clash over what a relationship is even supposed to look like.","clicks":"Aquarius is intrigued by Capricorn's discipline and ambition, a seriousness of purpose that its own more scattered idealism sometimes lacks. Capricorn, in turn, respects Aquarius's originality and intelligence, a mind that doesn't just follow the expected path. When it works, Aquarius brings fresh thinking into Capricorn's more traditional approach to life, and Capricorn gives Aquarius's abstract ideals some real, structured way to actually manifest.","strains":"Capricorn values tradition and proven paths; Aquarius often wants to break from exactly that, and the two can clash over what commitment should even look like \u2014 Capricorn wants the conventional markers of a serious relationship, Aquarius may resist those markers just because they're conventional. Capricorn's need for consistency, meanwhile, can feel confining to Aquarius's independent spirit, while Aquarius's emotional detachment can leave Capricorn uncertain whether it's actually loved or just intellectually appreciated.","real_test":"This pairing works if Capricorn learns to loosen its attachment to convention just enough to let Aquarius's originality genuinely reshape the relationship, and if Aquarius learns to offer Capricorn the consistency and reassurance it needs, even if it means occasionally following a more traditional path. Both signs are capable of real, serious devotion; the test is whether they can agree on what that devotion should actually look like in practice."},"Capricorn|Pisces":{"opening":"Earth meets water, and the meeting point is structure versus surrender. Capricorn Venus loves through discipline, responsibility, and long-term commitment. Pisces Venus loves through empathy, imagination, and emotional immersion. Capricorn gives Pisces something solid to hold onto; Pisces gives Capricorn access to a softness and emotional depth it doesn't always allow itself. Each has real potential to complete something the other is missing.","clicks":"Pisces finds genuine safety in Capricorn's steadiness \u2014 a partner who actually handles the practical world, freeing Pisces to be as dreamy and feeling as it naturally is. Capricorn, in turn, is quietly moved by Pisces's compassion and imagination, a permission to feel that Capricorn's disciplined exterior rarely grants itself. When it works, Capricorn becomes Pisces's anchor, and Pisces becomes the emotional richness that makes Capricorn's hard work feel meaningful rather than just necessary.","strains":"Capricorn's practicality and reserve can feel harsh against Pisces's more delicate, easily-hurt nature \u2014 a blunt, businesslike comment from Capricorn can land far heavier on Pisces than intended. Pisces's vagueness and tendency toward escapism, meanwhile, can frustrate Capricorn's need for clarity and reliability; Capricorn wants a plan and follow-through, and Pisces's more fluid relationship with structure and deadlines can test its patience.","real_test":"This pairing works if Capricorn learns to soften its directness and make more room for feeling, not just function, and if Pisces learns to meet Capricorn halfway with more consistency and practical follow-through than comes naturally. Each partner holds exactly what the other one needs; the test is whether they experience that difference as complementary rather than as a constant source of friction. Done right, this is a quietly powerful, deeply grounding pairing."},"Aquarius|Aquarius":{"opening":"Two people who love through friendship, ideas, and a shared resistance to convention. Aquarius Venus doesn't fall into romance so much as it grows into it \u2014 it wants a partner who's also a genuine friend, who respects independence, who won't demand a relationship look like everyone else's. Two of them together build something that often looks unconventional from the outside: an unusual amount of personal space, deep intellectual connection, and a real aversion to traditional romantic scripts, which suits both partners fine since neither one wanted those scripts anyway.","clicks":"Neither partner has to justify needing space, time alone, or friendships that stay important even inside the relationship, because both already live that way. Conversation tends to be genuinely stimulating \u2014 big ideas, social causes, future-oriented thinking \u2014 and neither one gets bored by the other's tendency to intellectualize feelings rather than just feel them. There's an ease of acceptance here too; Aquarius Venus doesn't try to change what it loves, and two of them together tend to give each other real, unconditional room to be exactly as odd or independent as they naturally are.","strains":"Two Aquarius Venuses can be so committed to independence and intellectual distance that actual emotional intimacy never quite arrives. Both partners may default to analyzing a feeling rather than sitting inside it, and two people doing that simultaneously can create a relationship that's stimulating and warm in its own way but strangely hard to get emotionally close to. Detachment is the other risk \u2014 Aquarius Venus can retreat into its head when things get intense, and with no partner pulling it back toward feeling, both people can drift into a relationship that runs on ideas more than intimacy.","real_test":"This pairing works if both partners can consciously choose vulnerability sometimes, treating emotional closeness as another interesting thing worth exploring rather than something to be slightly suspicious of. Aquarius Venus loves deeply, it just needs practice expressing that love in the body and the heart, not only in conversation. If both partners can build that muscle together, this becomes a genuinely rare kind of relationship \u2014 two people who are truly free, truly respect each other's individuality, and choose real closeness on top of that freedom rather than instead of it. If neither does, it stays a wonderful friendship that never quite becomes a full romance."},"Aquarius|Pisces":{"opening":"Two signs at the edge of the zodiac, both a little otherworldly in their own way. Aquarius Venus loves through independence and intellectual connection, often more comfortable with ideas than raw feeling. Pisces Venus loves through empathy and total emotional immersion, dissolving into feeling rather than analyzing it. These two can genuinely fascinate each other \u2014 Aquarius drawn to Pisces's depth, Pisces drawn to Aquarius's originality \u2014 though their fundamentally different relationships to emotion require real translation.","clicks":"Pisces is moved by Aquarius's uniqueness and its genuine acceptance of things other people find strange, which makes Pisces feel safe being exactly as unusual and sensitive as it naturally is. Aquarius, in turn, is quietly drawn into Pisces's emotional depth and imagination, a richness that its own more cerebral nature doesn't always access. Both signs are gentle, non-possessive, and genuinely open-minded, which removes a lot of the friction and control issues that trip up other pairings.","strains":"Aquarius processes the world through the mind first and can retreat into logic or detachment exactly when Pisces needs emotional presence most, which Pisces can experience as a lack of real closeness even when Aquarius does care. Pisces's tendency toward emotional overwhelm and occasional escapism, meanwhile, can be genuinely confusing for Aquarius, who prefers things a bit more legible and less prone to sudden mood shifts it doesn't fully understand.","real_test":"This pairing works if Aquarius learns to meet Pisces in feeling rather than retreating into analysis when things get emotionally intense, and if Pisces learns to be a bit clearer and more grounded about its needs rather than expecting Aquarius to simply intuit them. Both signs are unusually accepting and unconventional; the test is whether that acceptance extends into real emotional presence for each other. Done well, this is a gentle, imaginative, genuinely unusual pairing."},"Pisces|Pisces":{"opening":"Two people who love through empathy, imagination, and total emotional immersion. Pisces Venus doesn't love halfway \u2014 it dissolves into a relationship, wants to merge completely, sees the best in a partner sometimes before that partner has even shown it. Two of them together can create something genuinely dreamlike: deep compassion, artistic and emotional connection, a sense of having found someone who finally understands the depth of feeling that's usually too much for other people. The risk is two people so lost in the feeling of love that neither one is holding onto solid ground.","clicks":"Both partners offer each other something rare: total acceptance, without judgment, of even the most tender or complicated feelings. There's an intuitive quality to this pairing \u2014 neither partner has to explain a mood, because the other one already senses it. Creativity flows easily here too, whether that's shared art, music, or simply the way both partners romanticize small moments into something meaningful. Compassion runs deep on both sides; Pisces Venus forgives easily and loves generously, and two of them together tend to build a relationship with real emotional softness and genuine tenderness for each other's wounds.","strains":"Two Pisces Venuses can lose the practical thread of a relationship entirely \u2014 bills, boundaries, hard conversations, the unglamorous maintenance any partnership needs, none of that comes naturally to either partner, and without one person anchoring the relationship in reality, both can drift. Escapism is the bigger risk: when things get difficult, Pisces Venus can retreat into fantasy, distraction, or simply avoidance rather than confront what's wrong, and two people doing that simultaneously means real problems can go unaddressed for a long time, growing quietly worse while both partners privately hope it resolves itself.","real_test":"This pairing needs at least one partner, in any given moment, willing to stay grounded and say the practical, less romantic thing out loud \u2014 that a bill needs paying, that a boundary was crossed, that a problem needs solving rather than dreaming away. Pisces Venus's gift is its bottomless empathy, but empathy without structure can become two people drowning gently together instead of building something solid. If both partners can take turns being the anchor, this becomes an extraordinarily tender, creative, emotionally rich partnership. If neither does, it stays beautiful and slowly becomes difficult to actually live inside."}};

// build starfield
(function(){
  const starsEl = document.getElementById('stars');

  const count = 200;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*1.6 + 0.5;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*5)+'s';
    s.style.animationDuration = (6+Math.random()*8)+'s';
    starsEl.appendChild(s);
  }

  // a few larger, closer-looking dots
  const bigCount = 4;
  for(let i=0;i<bigCount;i++){
    const s = document.createElement('div');
    s.className = 'star star-close';
    const size = Math.random()*1.8 + 3.2;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*5)+'s';
    s.style.animationDuration = (7+Math.random()*7)+'s';
    starsEl.appendChild(s);
  }

  function spawnComet(){
    const wrap = document.createElement('div');
    wrap.style.position = 'absolute';

    // Always travel true corner to opposite corner, picking one of two diagonals at random
    const topLeftToBottomRight = Math.random() < 0.5;
    const startX = topLeftToBottomRight ? -5 : 105;
    const startY = -5;
    const angle = topLeftToBottomRight ? 45 : 135; // degrees: 45 = down-right, 135 = down-left

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const dist = Math.sqrt(vw*vw + vh*vh) * 1.15; // straight-line travel distance along the rotated axis, covers full diagonal

    wrap.style.left = startX+'vw';
    wrap.style.top = startY+'vh';
    wrap.style.transform = 'rotate('+angle+'deg)';

    const c = document.createElement('div');
    c.className = 'comet';
    c.style.setProperty('--dist', dist+'px');
    const dur = 2.4 + Math.random()*1.0;
    c.style.animationDuration = dur+'s';

    wrap.appendChild(c);
    starsEl.appendChild(wrap);
    setTimeout(()=>wrap.remove(), dur*1000 + 200);
  }

  function scheduleComet(){
    const delay = 4000 + Math.random()*7000;
    setTimeout(()=>{ spawnComet(); scheduleComet(); }, delay);
  }
  scheduleComet();

  function spawnUFO(){
    const leftToRight = Math.random() < 0.5;
    const y = 8 + Math.random()*55; // vertical position, upper-to-mid screen
    const w = 74;

    const wrap = document.createElement('div');
    wrap.style.position = 'absolute';
    wrap.style.top = y+'vh';
    wrap.style.left = leftToRight ? '-100px' : '';
    wrap.style.right = leftToRight ? '' : '-100px';
    wrap.style.width = w+'px';
    wrap.style.zIndex = '1';
    wrap.style.animation = 'ufo-fly '+(leftToRight?'normal':'reverse')+' 9s linear';

    const inner = document.createElement('div');
    if(!leftToRight){ inner.style.transform = 'scaleX(-1)'; }

    inner.innerHTML = `<svg viewBox="0 0 74 40" width="74" height="40" style="display:block;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,255,255,0.55)) drop-shadow(0 0 12px rgba(255,255,255,0.3));">
      <ellipse cx="37" cy="16" rx="13" ry="10" fill="#fff" opacity="0.75"/>
      <ellipse cx="37" cy="16" rx="13" ry="10" fill="none" stroke="#080a1c" stroke-width="1" opacity="0.4"/>
      <ellipse cx="37" cy="24" rx="34" ry="7" fill="#fff" opacity="0.8"/>
      <ellipse cx="37" cy="24" rx="34" ry="7" fill="none" stroke="#080a1c" stroke-width="1" opacity="0.4"/>
      <circle cx="20" cy="24" r="2" fill="#080a1c" opacity="0.45"/>
      <circle cx="30" cy="26" r="2" fill="#080a1c" opacity="0.45"/>
      <circle cx="44" cy="26" r="2" fill="#080a1c" opacity="0.45"/>
      <circle cx="54" cy="24" r="2" fill="#080a1c" opacity="0.45"/>
      <polygon points="24,29 50,29 40,44 34,44" fill="#fff" opacity="0.14"/>
    </svg>`;

    wrap.appendChild(inner);

    starsEl.appendChild(wrap);
    setTimeout(()=>wrap.remove(), 9200);
  }

  function scheduleUFO(){
    const delay = 55000 + Math.random()*10000; // roughly once a minute
    setTimeout(()=>{ spawnUFO(); scheduleUFO(); }, delay);
  }
  scheduleUFO();
})();

function venusSignForDate(dateStr){
  // dateStr: 'YYYY-MM-DD'
  let result = null;
  for(const t of VENUS_TRANSITIONS){
    if(t.date <= dateStr){ result = t.sign; } else { break; }
  }
  return result;
}

function populateTimeSelects(){
  ['p1hour','p2hour'].forEach(id=>{
    const el = document.getElementById(id);
    for(let h=1; h<=12; h++){
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h;
      el.appendChild(opt);
    }
  });
  ['p1min','p2min'].forEach(id=>{
    const el = document.getElementById(id);
    for(let m=0; m<60; m++){
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = String(m).padStart(2,'0');
      el.appendChild(opt);
    }
  });
}
populateTimeSelects();

function pairKey(signA, signB){
  const order = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
  const a = order.indexOf(signA), b = order.indexOf(signB);
  return a <= b ? signA+"|"+signB : signB+"|"+signA;
}

function validate(){
  const p1name = document.getElementById('p1name').value.trim();
  const p2name = document.getElementById('p2name').value.trim();
  const p1date = document.getElementById('p1date').value;
  const p2date = document.getElementById('p2date').value;
  const errorEl = document.getElementById('errorMsg');
  errorEl.textContent = '';

  if(!p1name || !p2name){
    errorEl.textContent = 'Both names are needed — even just an initial works.';
    return null;
  }
  if(!p1date || !p2date){
    errorEl.textContent = 'Both dates of birth are needed to find Venus.';
    return null;
  }
  return {p1name,p2name,p1date,p2date};
}

function runMatch(){
  const data = validate();
  if(!data) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.classList.add('spin-active');

  setTimeout(()=>{
    showResults(data);
    btn.classList.remove('spin-active');
    btn.disabled = false;
  }, 2200);
}

function showResults(data){
  const p1venus = venusSignForDate(data.p1date);
  const p2venus = venusSignForDate(data.p2date);
  const p1place = document.getElementById('p1place').value.trim();
  const p2place = document.getElementById('p2place').value.trim();
  const p1timeUnknown = document.getElementById('p1timeunknown').checked;
  const p2timeUnknown = document.getElementById('p2timeunknown').checked;
  const p1timeStr = p1timeUnknown ? '' : (document.getElementById('p1hour').value+':'+String(document.getElementById('p1min').value).padStart(2,'0')+' '+document.getElementById('p1ampm').value);
  const p2timeStr = p2timeUnknown ? '' : (document.getElementById('p2hour').value+':'+String(document.getElementById('p2min').value).padStart(2,'0')+' '+document.getElementById('p2ampm').value);

  document.getElementById('resultNames').innerHTML =
    data.p1name + ' <span>&amp;</span> ' + data.p2name;

  document.getElementById('recap1who').textContent = data.p1name;
  document.getElementById('recap1venus').textContent = 'Venus in ' + p1venus;
  document.getElementById('recap1meta').innerHTML =
    formatDate(data.p1date) + (p1timeUnknown? ' &middot; time unknown' : (p1timeStr? ' &middot; '+p1timeStr:'')) + (p1place? '<br>'+escapeHtml(p1place):'');

  document.getElementById('recap2who').textContent = data.p2name;
  document.getElementById('recap2venus').textContent = 'Venus in ' + p2venus;
  document.getElementById('recap2meta').innerHTML =
    formatDate(data.p2date) + (p2timeUnknown? ' &middot; time unknown' : (p2timeStr? ' &middot; '+p2timeStr:'')) + (p2place? '<br>'+escapeHtml(p2place):'');

  document.getElementById('venusBanner').innerHTML =
    data.p1name + '\'s Venus in <b>'+p1venus+'</b> meets '+data.p2name+'\'s Venus in <b>'+p2venus+'</b>';

  const key = pairKey(p1venus, p2venus);
  const entry = COMPAT_DATA[key];
  const contentEl = document.getElementById('compatContent');
  const missingEl = document.getElementById('missingNote');

  if(entry){
    contentEl.style.display = 'block';
    missingEl.style.display = 'none';
    contentEl.innerHTML = `
      <div class="section"><p>${entry.opening}</p></div>
      <div class="section"><h3>Where it clicks</h3><p>${entry.clicks}</p></div>
      <div class="section"><h3>Where it strains</h3><p>${entry.strains}</p></div>
      <div class="section"><h3>The real test</h3><p>${entry.real_test}</p></div>
    `;
  } else {
    contentEl.style.display = 'none';
    missingEl.style.display = 'block';
    missingEl.textContent = 'The full write-up for ' + p1venus + ' + ' + p2venus + ' is still being written \u2014 check back soon.';
  }

  document.getElementById('formView').style.display = 'none';
  document.getElementById('resultsView').style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function goBack(){
  document.getElementById('resultsView').style.display = 'none';
  document.getElementById('formView').style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function formatDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
